<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dựng video</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@500;600;700;800;900&family=Dancing+Script:wght@700&family=Lexend:wght@600;800&family=Montserrat:wght@700;900&family=Pacifico&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie_canvas.min.js"></script>
<style>
:root{--bg:#0e1013;--card:#171a1f;--card2:#1e2229;--line:#2a2f38;--text:#e8ebef;--muted:#99a2ad;--faint:#6b7480;--brand:#1fa463;--brand2:#168a52;--warn:#f0b429;--bad:#f2555a;--good:#3ccf7f;--acc:#ffe14d}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:#121418;position:sticky;top:0;z-index:5}
.top h1{margin:0;font-size:17px;font-weight:800;color:var(--brand)}.top .sp{flex:1}.top .me{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:#3a414c}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{background:var(--brand2)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}.btn.ghost{background:transparent}
.btn.rec{background:#3a1416;border-color:#7a2228;color:#ffb3b6}
.inp{width:100%;background:#0f1215;border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none}.inp:focus{border-color:var(--brand)}
textarea.inp{resize:vertical;min-height:64px}
label.f{display:block;margin-bottom:9px}label.f>span{display:block;font-size:12px;color:var(--muted);margin-bottom:3px;font-weight:600}
.wrap{display:grid;grid-template-columns:340px minmax(380px,1fr) 380px;gap:14px;padding:14px 16px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:14.5px;display:flex;align-items:center;gap:8px}.card h3 .n{width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 8px}
.drop.bin{padding:14px 8px;line-height:1.35}.drop.bin small{color:var(--muted)}
.drop{border:1.5px dashed #3a414c;border-radius:12px;padding:16px;text-align:center;color:var(--muted);cursor:pointer;display:block}.drop:hover{border-color:var(--brand);color:var(--text)}
.clip{display:flex;gap:9px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:7px;margin-top:7px}
.clip img,.clip .ph{width:40px;height:62px;border-radius:6px;object-fit:cover;background:#000;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px}
.clip .meta{flex:1;min-width:0}.clip .nm{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.clip .st{font-size:11.5px;color:var(--muted)}
.clip select{background:#0f1215;border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:12px}
.clip .x{background:none;border:0;color:var(--faint);cursor:pointer;font-size:15px}
.bar{height:5px;border-radius:9px;background:#2a2f38;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--brand);width:0}
.stage{position:sticky;top:64px}
.pv{background:#000;border-radius:16px;overflow:hidden;position:relative;margin:0 auto;aspect-ratio:9/16;max-height:calc(100vh - 230px);border:1px solid var(--line)}
.pv canvas{width:100%;height:100%;display:block}
.pv .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--faint);text-align:center;padding:30px;gap:8px}
.ctrl{display:flex;align-items:center;gap:10px;margin:10px auto 0;max-width:520px}.ctrl .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;min-width:92px;text-align:right}
.tl{position:relative;height:46px;background:var(--card2);border-radius:9px;overflow:hidden;flex:1;cursor:pointer;border:1px solid var(--line)}
.tl .v{position:absolute;top:0;height:28px;border-right:1px solid #0e1013}.tl .a{position:absolute;top:30px;height:7px;border-radius:2px}.tl .c{position:absolute;top:39px;height:5px;background:#8b95a1;border-radius:2px}
.tl .ph{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 6px #fff}
.var{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:var(--card2)}.var.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.var b{font-size:13.5px}.var .sc{float:right;font-weight:800;font-size:15px}.var .d{font-size:12px;color:var(--muted);margin-top:3px}
.chk{list-style:none;margin:0;padding:0}.chk li{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #22262d;font-size:12.8px}.chk li:last-child{border:0}
.chk .ic{flex:none;width:20px;text-align:center}.chk .tip{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.big{font-size:34px;font-weight:900;line-height:1}.lbl{font-size:12px;color:var(--muted)}
.sent{display:flex;gap:7px;align-items:flex-start;padding:6px 0;border-bottom:1px solid #22262d}.sent:last-child{border:0}
.sent .t{flex:1;font-size:12.8px;outline:none;border-radius:6px;padding:2px 4px}.sent .t:focus{background:#0f1215;box-shadow:0 0 0 1px var(--brand)}
.sent .tm{font-size:11px;color:var(--faint);flex:none;width:48px;font-variant-numeric:tabular-nums}
.sent .hk{border:0;background:none;cursor:pointer;opacity:.35;font-size:14px}.sent .hk.on{opacity:1}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;background:#2a2f38;color:var(--muted)}
.pill.g{background:#123d27;color:var(--good)}.pill.w{background:#3d3112;color:var(--warn)}.pill.b{background:#3d1416;color:var(--bad)}
.toast{position:fixed;right:16px;bottom:16px;background:#22272f;border:1px solid var(--line);border-radius:10px;padding:10px 14px;max-width:420px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.4)}.toast.err{border-color:var(--bad)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:40}
.ov .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(640px,94vw)}
.login{max-width:380px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
details.book summary{cursor:pointer;font-weight:700}details.book ol{padding-left:18px;margin:8px 0 0}details.book li{margin-bottom:6px;font-size:12.8px;color:#cdd3da}
.prompt{background:#0f1215;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:18px;line-height:1.5;max-height:180px;overflow:auto;margin:8px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mob{display:none;padding:10px 16px;background:#3d3112;color:var(--warn);font-size:13px}

.steps{display:flex;gap:6px;margin-left:14px;flex-wrap:wrap}.st{padding:6px 13px;border-radius:999px;background:var(--card2);color:var(--muted);font-weight:700;font-size:12.5px;border:1px solid var(--line);cursor:pointer}.st.on{background:var(--brand);border-color:var(--brand);color:#fff}.st.ok{color:var(--brand)}
.wrap2{display:grid;grid-template-columns:420px minmax(0,1fr);gap:14px;padding:14px 16px;align-items:start}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card2);font-size:12.5px;cursor:pointer;user-select:none}.chip.on{border-color:var(--brand);background:#123d27;color:#7ee2a8}
.lbl{font-size:12px;color:var(--muted);font-weight:700;margin-top:6px}
.hook{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:7px;background:var(--card2);cursor:pointer}.hook.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}.hook small{display:block;color:var(--muted);font-size:11.5px}
.hd{display:grid;grid-template-columns:96px 1fr 300px;font-size:11.5px;color:var(--muted);font-weight:700;padding:0 12px 6px}
.sec{display:grid;grid-template-columns:96px 1fr 300px;border-top:1px solid var(--line)}.sec>div{padding:10px 12px}
.sec .tag{font-weight:800;font-size:12px}.sec .tag i{display:block;font-style:normal;color:var(--muted);font-weight:600;font-size:11px}.sec .tag i.tc{color:#ffb86b}
.sec .say{font-size:14px;outline:none;border-radius:8px}.sec .say:focus,[data-shot]:focus{background:#0f1215;box-shadow:0 0 0 1px var(--brand);outline:none}
.shot{background:#0f1215;border:1px dashed #3a414c;border-radius:10px;padding:8px 10px;font-size:12.5px}.shot b{color:#7ec3ff}.shot small{display:block;color:var(--muted)}
.slot{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #22262d}.slot .sn{width:24px;height:24px;border-radius:50%;background:#2a2f38;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none}.slot.ok .sn{background:var(--brand);color:#fff}
.slot .st2{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.slot select{width:100%;background:#0f1215;border:1px solid var(--line);border-radius:7px;padding:3px 5px;font-size:12px;margin-top:3px}
.tp{background:#000}.tpbox{width:min(900px,96vw);height:92vh;display:flex;flex-direction:column}.tptext{flex:1;overflow:auto;font-weight:700;line-height:1.5;padding:30vh 20px 0;text-align:center}.tptext small{display:block;font-size:14px;color:var(--brand)}.tptext p{margin:0 0 28px}
.tpbar{display:flex;gap:12px;align-items:center;padding:10px;border-top:1px solid var(--line)}
@media (max-width:1150px){.wrap2{grid-template-columns:1fr}}
@media (max-width:1150px){.wrap{grid-template-columns:320px 1fr}.wrap .right{grid-column:1 / -1}.stage{position:static}}
@media (max-width:760px){.wrap{grid-template-columns:1fr}.mob{display:block}}
</style>
</head>
<body>

<script type="module">
/* ===================== DỰNG VIDEO – OPPO MIỀN ĐÔNG (Đợt 1) ===================== */
const VERSION = '2026.11.15-2230';

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = t => { t = Math.max(0, t || 0); const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const once = (el, ev) => new Promise((res, rej) => { const ok = () => { off(); res(); }, bad = () => { off(); rej(new Error(ev + ' lỗi')); }; const off = () => { el.removeEventListener(ev, ok); el.removeEventListener('error', bad); }; el.addEventListener(ev, ok); el.addEventListener('error', bad); });
function rng(seed) { let a = (seed >>> 0) || 1; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rr = (R, [a, b]) => a + (b - a) * R();
function pct(arr, p) { if (!arr.length) return 0; const s = Float32Array.from(arr).sort(); return s[Math.min(s.length - 1, Math.floor(p * s.length))]; }
let AC = null; const actx = () => AC || (AC = new (window.AudioContext || window.webkitAudioContext)());

/* ---------- Sổ tay TikTok: kiến thức nền mà "đạo diễn" dùng ---------- */
const BOOK = [
  ['Hook 0–2 giây', 'Câu đầu tiên phải gây tò mò / chạm nỗi đau / hứa lợi ích. Không chào hỏi, không giới thiệu tên. Mặt người + chữ to ngay khung đầu.'],
  ['Giữ nhịp', 'Cứ 2–4 giây phải có thay đổi: cắt cảnh, zoom, chèn cảnh điện thoại, chữ nổi. Cắt bỏ mọi khoảng lặng > 0,3s.'],

  ['3 ý chính', 'Đánh dấu bằng "thứ nhất / thứ hai / cuối cùng" hoặc con số. Mỗi ý có 1 chữ nổi (callout) để người xem lướt vẫn nắm.'],
  ['Phụ đề', '85% người xem tắt tiếng lúc đầu. Phụ đề to, 2–4 chữ mỗi nhịp, nhấn màu chữ đang nói. Đặt ở 60–70% chiều cao, tránh cột nút bên phải và mô tả bên dưới.'],
  ['Vùng an toàn', 'Không đặt chữ ở 12% trên cùng, 25% dưới cùng và 140px mép phải – bị giao diện TikTok che.'],
  ['B-roll', 'Khi người nói nhắc tới tính năng → chuyển ngay sang cảnh quay điện thoại, giọng vẫn chạy (L-cut). Tỉ lệ đẹp: 30–50% thời lượng.'],
  ['CTA', 'Kết bằng 1 hành động duy nhất, rõ ràng: "Ghé shop gần nhất…", "Comment …", "Follow để xem phần 2". Hiện chữ + nói cùng lúc ở 3–5s cuối.'],
  ['Âm thanh', 'Giọng nói là chính, nhạc nền nhỏ và tự hạ khi có giọng. Hiệu ứng whoosh khi chuyển cảnh, pop khi chữ nổi xuất hiện.'],
  ['Thời lượng', 'Ngắn mà đủ ý tốt hơn dài. 25–45s dễ xem hết; tối đa 60s. Video xem hết + xem lại được đẩy mạnh nhất.'],
];
const HOOK_WORDS = ['bạn có biết', 'tại sao', 'vì sao', 'đừng', 'sai lầm', 'bí mật', 'mẹo', 'cách', 'chỉ cần', 'ngay', 'miễn phí', 'không ai', 'ít ai', 'đây là', 'thử', 'sự thật', 'quá', 'đỉnh', 'cực', 'nhất', 'ai mà', 'có ai', 'hết', 'liệu', 'giảm', 'tặng', 'mới', 'tin không', 'thật không', 'khác biệt', 'được gì', 'dám', 'vs', '?', '!'];
const KEY_WORDS = ['camera', 'pin', 'sạc', 'màn hình', 'chống nước', 'ai', 'zoom', 'chụp', 'quay', 'chip', 'ram', 'bền', 'nhanh', 'mỏng', 'nhẹ', 'trả góp', 'giảm', 'tặng', 'quà', 'bảo hành', 'đêm', 'chân dung', 'selfie', 'mah', 'w', 'mp', 'gb', 'hz', 'ip68', 'ip69', 'reno', 'find', 'oppo'];
const POINT_RE = /^(thứ nhất|thứ hai|thứ ba|đầu tiên|tiếp theo|cuối cùng|thêm nữa|ngoài ra|một là|hai là|ba là|số \d|\d[.)])/i;

/* ---------- Kiểu dựng (phương án) ---------- */
const STYLES = {
  A: { key: 'A', name: 'Gọn – cuốn', desc: 'Giữ thứ tự lời nói, lia nhoè chuyển cảnh, chữ nổi nền màu, mặt người trong khung tròn.', face: [2.2, 3.4], br: [1.8, 2.6], trans: ['whip', 'circle', 'cut', 'wipe', 'leak'], hookStyle: 'stack', stamp: true, arrow: true, lib: true, bpm: 104, every: 6, cap: 'hl', grade: 'contrast(1.07) saturate(1.12)', hookFirst: false, teaser: false, pip: 0.55, split: 0.15, mood: 'vui' },

  C: { key: 'C', name: 'Điện ảnh – teaser', desc: 'Mở bằng cảnh đẹp nhất + tiêu đề, zoom mượt, vệt sáng, hạt phim, màu trầm.', face: [2.6, 3.8], br: [2.2, 3.2], trans: ['zoom', 'leak', 'slide', 'circle'], hookStyle: 'neon', sparkle: true, lib: true, bpm: 90, every: 7, cap: 'karaoke', grade: 'contrast(1.05) saturate(0.92) brightness(1.03)', hookFirst: false, teaser: true, pip: 0.2, split: 0.4, grain: true, mood: 'dien-anh' },
};
const EMOJI = [[/chụp|ảnh|camera|máy ảnh/, '📸'], [/đêm|tối/, '🌙'], [/pin|mah/, '🔋'], [/sạc|nhanh|\d+w\b/, '⚡'], [/màn hình|lướt/, '📱'], [/quà|tặng/, '🎁'], [/giá|giảm|rẻ|trả góp|ưu đãi|khuyến mãi/, '💸'], [/đẹp|sang|xịn/, '✨'], [/mỏng|nhẹ/, '🪶'], [/bền|nước|mưa/, '💧'], [/game|chip|mượt|hiệu năng/, '🎮'], [/\bai\b/, '🤖'], [/video|quay/, '🎬'], [/selfie|chân dung|da\b/, '🤳'], [/thích|yêu|mê/, '😍'], [/shop|ghé|cửa hàng/, '📍'], [/đỉnh|quá|cực|wow|ngon/, '🔥'], [/tin không|thật không|sao\?|\?$/, '🤔'], [/zoom|xa/, '🔭'], [/cả ngày|lâu/, '⏳']];
const emojiOf = w => { const s = w.toLowerCase(); for (const [re, e] of EMOJI) if (re.test(s)) return e; return ''; };

/* ---------- Thư viện công thức kịch bản (không cần AI) ---------- */
const FEATS = [

      ${S.bwhy[c.id] ? `<div class="sub" style="margin:2px 0 0">🤖 ${esc(S.bwhy[c.id])}</div>` : ''}</div></div>`; }).join('')

  if (!P.sections.length) { el.innerHTML = '<p class="sub">Chưa có kịch bản – web tự chọn cảnh. Muốn dựng đúng thứ tự, hãy làm bước 1–2. Có clip A-roll dài thì bấm ✂️ Tự cắt chỗ vấp, web sẽ tự ghép B-roll theo lời.</p>'; return; }

function fixKinds() {   // 1 clip A-roll dài + nhiều B-roll: clip dài nhất có giọng là người nói, còn lại là cảnh quay
  const vids = S.clips.filter(c => c.hasVideo && !c.st && !c.userKind); if (vids.length < 2) return;
  const talky = vids.filter(c => c.voiced && c.voiced.length && c.voicedRatio > 0.25).sort((a, b) => b.dur - a.dur);
  const longest = talky[0]; if (!longest) return;
  if (longest.dur >= 15 && longest.dur > 1.8 * Math.max(...vids.filter(c => c !== longest).map(c => c.dur))) vids.forEach(c => { c.kind = c === longest ? 'talk' : (c.kind === 'talk' ? 'broll' : c.kind); });
}
async function addFiles(files, forced) {
  const list = [];

    const c = { id: nextId++, file: f, name: f.name, url: URL.createObjectURL(f), st: 'Chờ phân tích…', prog: 0, kind: forced || '', userKind: !!forced, sents: [] };
    S.clips.push(c); list.push(c);
  }
  drawClips();
  let i = 0; const worker = async () => { while (i < list.length) { const c = list[i++];   // phân tích 2 clip song song
    try { await analyzeClip(c, forced); c.st = ''; } catch (e) { c.st = 'Lỗi: ' + e.message; c.bad = true; }
    drawClips(); refreshButtons(); } };
  await Promise.all([worker(), worker()]);
  if (!S.clips.some(x => x.st && !x.bad)) fixKinds();
  drawClips(); refreshButtons(); drawSlots();
  if (!S.clips.some(x => x.st && !x.bad) && S.gemKey && S.plan.sections.length && !S.slotsLocked && !arollKept().length && S.clips.filter(x => x.kind === 'broll').length > 1) aiSlots(false);
  if (arollKept().length && list.some(c => c.kind === 'broll')) { S.bmap = {}; drawSlots(); }
}

  catch (e) { throw new Error('Chrome không mở được clip này. Nếu quay bằng điện thoại, vào Cài đặt camera → Mã hoá video → chọn H.264 / "Tương thích cao" rồi quay lại, hoặc gửi clip qua Zalo/Drive để được chuyển định dạng.'); }

function audioStats(c) {
