<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Game đào tạo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--bg2:#121a33;--card:#18213f;--card2:#202b52;--line:#2c3866;--tx:#eef2ff;--mut:#9aa6cf;--brand:#00c26e;--brand2:#00e08a;--acc:#ffcf33;--bad:#ff4d6d;--ok:#2ee59d;--blue:#3d8bff;--pink:#ff5bc8;--vio:#9b6bff;--org:#ff8a3d;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:'Be Vietnam Pro',system-ui,Segoe UI,Roboto,sans-serif}
body{overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
a{color:var(--brand2)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);padding:9px 14px;border-radius:12px;cursor:pointer;font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--brand);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,var(--brand),#00a35c);border-color:transparent;color:#03140b}
.btn.acc{background:var(--acc);color:#241a00;border-color:transparent}
.btn.bad{background:var(--bad);border-color:transparent;color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn.lg{padding:14px 22px;font-size:20px;border-radius:16px}
.btn:disabled{opacity:.5;pointer-events:none}
.inp,select.inp,textarea.inp{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none}
.inp:focus{border-color:var(--brand)}
textarea.inp{min-height:90px;resize:vertical;line-height:1.45}
.sub{color:var(--mut);font-size:14px;line-height:1.5}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:12px;font-weight:600}
.pill.g{background:rgba(0,194,110,.15);border-color:rgba(0,194,110,.5);color:var(--brand2)}
.pill.y{background:rgba(255,207,51,.12);border-color:rgba(255,207,51,.5);color:var(--acc)}
.pill.r{background:rgba(255,77,109,.12);border-color:rgba(255,77,109,.5);color:#ff8fa3}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:13px;color:var(--mut);margin-bottom:4px;font-weight:600}
/* ----- thư viện ----- */
.top{position:sticky;top:0;z-index:20;background:rgba(11,16,32,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 16px}
.top h1{margin:0;font-size:20px;font-weight:900;letter-spacing:.3px}
.top h1 b{color:var(--brand2)}
.wrap{max-width:1280px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.tab{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;font-size:14px}
.tab.on{background:var(--brand);color:#03140b;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.gc{position:relative;background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:18px;padding:14px;cursor:pointer;transition:.15s;min-height:150px;display:flex;flex-direction:column}
.gc:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.gc .no{position:absolute;top:10px;right:12px;color:var(--mut);font-weight:800;font-size:13px}
.gc .ic{font-size:34px;line-height:1}
.gc h3{margin:8px 0 4px;font-size:17px;line-height:1.25}
.gc p{margin:0;color:var(--mut);font-size:13px;line-height:1.45;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.gc .meta{margin-top:8px;display:flex;gap:5px;flex-wrap:wrap}
.grpA{--gcol:#3d8bff}.grpB{--gcol:#00c26e}.grpC{--gcol:#ff5bc8}.grpD{--gcol:#ffcf33}.grpE{--gcol:#9b6bff}.grpF{--gcol:#ff8a3d}.grpG{--gcol:#22d3ee}
.gc{border-top:4px solid var(--gcol)}
.gl{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--gcol);color:#081022;font-weight:800;font-size:12px}
/* modal */
.mask{position:fixed;inset:0;background:rgba(3,6,15,.72);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;animation:fi .15s}
.modal{background:var(--card);border:1px solid var(--line);border-radius:20px;width:min(860px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal.wide{width:min(1180px,100%)}
.modal .mh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mh h2{margin:0;font-size:20px;flex:1}
.modal .mb{padding:16px 18px;overflow:auto}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{background:none;border:0;font-size:26px;cursor:pointer;color:var(--mut)}
@keyframes fi{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f1730;border:1px solid var(--line);padding:12px 18px;border-radius:12px;z-index:200;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.5);font-weight:600}
.toast.bad{border-color:var(--bad)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
table.t th{color:var(--mut);font-size:12px;text-transform:uppercase}
tr.warn td{background:rgba(255,207,51,.10)}
.det h4{margin:14px 0 6px;color:var(--acc);font-size:15px}
.det p{margin:0 0 6px;line-height:1.55}
/* ----- sân khấu (trình chiếu) ----- */
#stage{position:fixed;inset:0;z-index:50;background:radial-gradient(1200px 700px at 50% -10%,#1d2a63 0%,#0b1020 55%,#060914 100%);display:flex;flex-direction:column;overflow:hidden}
#stage .sbar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:rgba(0,0,0,.25);border-bottom:1px solid rgba(255,255,255,.06);z-index:5;transition:opacity .3s}
#stage .sbar .tt{font-weight:900;font-size:18px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage .sbar .tt small{color:var(--mut);font-weight:600;margin-left:8px}
#stage.idle .sbar,#stage.idle .ctl{opacity:.12}
#stage.idle{cursor:none}
#stage .main{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
#stage .ctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:6px 10px;transition:opacity .3s;z-index:5}
.teams{display:flex;gap:10px;justify-content:center;padding:8px 12px 12px;flex-wrap:wrap;z-index:5}
.team{min-width:130px;padding:8px 14px;border-radius:16px;background:rgba(255,255,255,.06);border:2px solid var(--tc);display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;transition:.2s}
.team .tn{font-weight:800;font-size:16px;color:var(--tc)}
.team .ts{font-weight:900;font-size:30px;min-width:40px;text-align:right;margin-left:auto}
.team .tk{font-size:11px;color:var(--mut)}
.team.bump{transform:scale(1.12);background:color-mix(in srgb,var(--tc) 30%,transparent)}
.team.lead{box-shadow:0 0 22px color-mix(in srgb,var(--tc) 60%,transparent)}
.big{font-size:clamp(28px,5.2vw,86px);font-weight:900;line-height:1.12;text-align:center;letter-spacing:-.5px}
.mid{font-size:clamp(22px,3.2vw,52px);font-weight:800;line-height:1.2;text-align:center}
.sm2{font-size:clamp(16px,1.8vw,28px);color:var(--mut);text-align:center;line-height:1.35}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;width:100%;height:100%;padding:2vh 4vw;text-align:center}
.qbox{max-width:1400px;width:100%}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1.6vh 1.6vw;width:100%;max-width:1400px}
.opt{position:relative;padding:2.2vh 2vw 2.2vh 6vw;border-radius:20px;font-size:clamp(18px,2.4vw,40px);font-weight:800;text-align:left;background:var(--oc);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.35);transition:.3s;min-height:11vh;display:flex;align-items:center}
.opt .k{position:absolute;left:1.6vw;top:50%;transform:translateY(-50%);width:3.4vw;height:3.4vw;min-width:34px;min-height:34px;border-radius:12px;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:clamp(16px,1.8vw,30px)}
.opt.dim{opacity:.18;filter:grayscale(1)}
.opt.win{outline:6px solid #fff;transform:scale(1.03);box-shadow:0 0 40px rgba(255,255,255,.5)}
.opt .cnt{margin-left:auto;font-size:.8em;background:rgba(0,0,0,.3);border-radius:10px;padding:2px 10px}
.c0{--oc:#e5354f}.c1{--oc:#2f6fe4}.c2{--oc:#d99a00}.c3{--oc:#1f9d55}.c4{--oc:#8b4bff}.c5{--oc:#ff6b2c}
.expl{background:rgba(255,255,255,.07);border-left:6px solid var(--acc);padding:1.4vh 1.6vw;border-radius:12px;font-size:clamp(16px,1.8vw,30px);max-width:1300px;text-align:left}
.tmr{position:absolute;top:1.4vh;right:1.6vw;width:min(13vh,120px);height:min(13vh,120px);z-index:4}
.tmr svg{width:100%;height:100%;transform:rotate(-90deg)}
.tmr .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:min(5.4vh,48px)}
.tmr.hurry .n{color:var(--bad);animation:pulse .5s infinite}
.tbar{position:absolute;left:0;bottom:0;height:8px;background:linear-gradient(90deg,var(--brand),var(--acc),var(--bad));transform-origin:left;z-index:4}
@keyframes pulse{50%{transform:scale(1.15)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes shake{10%,90%{transform:translateX(-4px)}20%,80%{transform:translateX(6px)}30%,50%,70%{transform:translateX(-10px)}40%,60%{transform:translateX(10px)}}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes glow{50%{text-shadow:0 0 30px currentColor}}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.shake{animation:shake .5s}
.flash{position:absolute;inset:0;pointer-events:none;z-index:30;animation:fl .6s forwards}
@keyframes fl{from{opacity:.8}to{opacity:0}}
.ovl{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(3,6,15,.82);flex-direction:column;gap:2vh;animation:fi .2s}
canvas.fx{position:fixed;inset:0;pointer-events:none;z-index:90}
.tile{perspective:1000px}
.tile .in{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.tile.open .in{transform:rotateY(180deg)}
.tile .fr,.tile .bk{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;align-items:center;justify-content:center;padding:1vh 1vw;text-align:center;font-weight:800}
.tile .fr{background:linear-gradient(145deg,#2a3a7a,#1a2552);border:2px solid #3b4c95;font-size:clamp(22px,3vw,52px);color:var(--acc)}
.tile .bk{transform:rotateY(180deg);background:linear-gradient(145deg,#fff,#dfe7ff);color:#0b1020;font-size:clamp(14px,1.7vw,30px)}
.chip{display:inline-block;padding:.6vh 1.2vw;border-radius:14px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);font-weight:800;font-size:clamp(16px,2vw,34px)}
.lev{display:flex;gap:6px}
.lev .btn.on{background:var(--acc);color:#241a00}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:0 6px;font-size:12px;color:var(--mut);margin-left:4px}
/* đăng nhập & điện thoại */
.login{max-width:420px;margin:10vh auto;padding:24px}
.ph{max-width:520px;margin:0 auto;padding:16px;min-height:100vh;display:flex;flex-direction:column;gap:12px}
.ph .pbtn{border:0;border-radius:18px;padding:22px 16px;font-size:22px;font-weight:800;color:#fff;background:var(--oc);box-shadow:0 5px 0 rgba(0,0,0,.35);text-align:left;cursor:pointer}
.ph .pbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.ph .pbtn.sel{outline:5px solid #fff}
@media (max-width:700px){.opts{grid-template-columns:1fr}.opt{padding-left:16vw}.opt .k{left:3vw;width:9vw;height:9vw}.top h1{font-size:17px}}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0;width:100%;color:#000;background:#fff}}
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea" class="hidden"></div>
<script>
/* ===== 10_core.js ===== */
'use strict';
/* =========================================================
   GAME ĐÀO TẠO – lõi: tiện ích, kết nối web nhân sự, âm thanh, pháo giấy,
   sân khấu trình chiếu, bảng điểm đội, đồng hồ, vòng quay
   ========================================================= */
const VERSION = '2026.11.18-0500';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase().trim();
const plain = s => norm(s).toUpperCase().replace(/[^A-Z0-9]/g, '');
const lines = s => String(s || '').split(/\n/).map(x => x.trim()).filter(Boolean);
function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, typeof v === 'string' ? v : JSON.stringify(v)); } catch (e) {} }
function load(k, def) { try { const v = localStorage.getItem(k); if (v == null) return def; try { return JSON.parse(v); } catch (e) { return v; } } catch (e) { return def; } }
const TEAM_COLORS = ['#ff4d6d', '#3d8bff', '#ffcf33', '#2ee59d', '#b26bff', '#ff8a3d', '#22d3ee', '#ff5bc8'];
const TEAM_NAMES = ['Đội Đỏ', 'Đội Xanh', 'Đội Vàng', 'Đội Lá', 'Đội Tím', 'Đội Cam', 'Đội Biển', 'Đội Hồng'];

const S = {
  api: '', token: '', me: null, dev: false,
  bank: [], data: {}, gemKey: '',
  cls: load('gm_cls', null) || { name: '', teams: [], roster: [], rows: [] },
  hist: load('gm_hist', []),
  room: null
};
if (!S.cls.teams || !S.cls.teams.length) S.cls.teams = [0, 1, 2, 3].map(i => ({ name: TEAM_NAMES[i], color: TEAM_COLORS[i], score: 0 }));
function saveCls() { store('gm_cls', S.cls); }

/* ---------- kết nối ---------- */
async function call(action, payload, opt) {
  const api = (opt && opt.api) || S.api;
  if (!api) throw new Error('Chưa có địa chỉ web nhân sự.');
  if (S.dev && !(opt && opt.real)) return devCall(action, payload);
  let r; try { r = await fetch(api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, token: S.token, payload: payload || {} }) }); }
  catch (e) { const er = new Error('Không kết nối được web nhân sự – kiểm tra mạng. Nếu vẫn lỗi: web nhân sự cần Deploy bản mới, quyền truy cập "Anyone".'); er.net = true; throw er; }
  let j; try { j = await r.json(); } catch (e) { const er = new Error('Link web nhân sự không đúng hoặc chưa Deploy bản mới (mã ' + r.status + ').'); er.net = true; throw er; }
  if (!j.ok) throw new Error(j.error || 'Lỗi máy chủ');
  return j.data;
}
/* chế độ thử trên máy (không có web nhân sự) – lưu tạm trong trình duyệt */
const DEV = load('gm_dev_db', { bank: [], data: {}, letters: [], rooms: {} });
function devSave() { const cur = load('gm_dev_db', DEV); DEV.rooms = (cur && cur.rooms) || {}; store('gm_dev_db', DEV); }
async function devCall(a, p) {
  await sleep(60);
  switch (a) {
    case 'gameMe': return { username: 'thu', name: 'Thử nghiệm', role: 'Admin', isAdmin: true, appTitle: 'OPPO MIỀN ĐÔNG', open: false };
    case 'gameBank': return DEV.bank.map(b => Object.assign({ canEdit: true }, b));
    case 'gameBankSave': { let b = p.id && DEV.bank.find(x => x.id === p.id); if (!b) { b = { id: 'B' + Date.now(), owner: 'thu', ownerName: 'Thử nghiệm' }; DEV.bank.push(b); } Object.assign(b, { name: p.name, product: p.product, topic: p.topic, items: p.items, updated: new Date().toLocaleString('vi') }); devSave(); return { id: b.id }; }
    case 'gameBankDel': DEV.bank = DEV.bank.filter(x => x.id !== p.id); devSave(); return true;
    case 'gameData': return DEV.data;
    case 'gameDataSave': if (p.value == null) delete DEV.data[p.key]; else DEV.data[p.key] = p.value; devSave(); return true;
    case 'gameLog': return true;
    case 'gameLetters': return DEV.letters;
    case 'gameLettersSave': (p.letters || []).forEach(l => DEV.letters.push({ id: 'T' + Date.now(), at: new Date().toLocaleDateString('vi'), cls: p.cls, who: l.who, text: l.text, due: '+' + (p.days || 30) + ' ngày', done: '' })); devSave(); return { saved: (p.letters || []).length, due: '30 ngày nữa' };
    case 'roomState': case 'roomJoin': case 'roomAnswer': {
      const db = load('gm_dev_db', DEV); const R = db.rooms[p.code]; if (!R) throw new Error('Không tìm thấy phòng ' + p.code);
      let out;
      if (a === 'roomState') out = Number(p.v) === R.v ? { same: true, v: R.v } : { v: R.v, st: R.st, teams: R.teams, openAt: R.openAt };
      else if (a === 'roomJoin') { let me = R.players.find(x => x.id === p.pid); if (!me) { me = { id: 'p' + Date.now().toString(36), name: p.name, team: p.team }; R.players.push(me); } out = { pid: me.id, name: me.name, team: me.team, teams: R.teams }; }
      else { if (!R.st.open || R.st.qid !== p.qid) out = { late: true }; else { R.ans[p.qid] = R.ans[p.qid] || {}; R.ans[p.qid][p.pid] = { a: p.a, t: Date.now() - (R.openAt || Date.now()) }; out = { ok: true }; } }
      store('gm_dev_db', db); return out;
    }
    case 'roomCreate': { const db = load('gm_dev_db', DEV); const code = String(rint(100000, 999999)); db.rooms[code] = { v: 1, st: { kind: 'wait' }, players: [], ans: {}, teams: p.teams || [] }; store('gm_dev_db', db); return { code }; }
    case 'roomPush': { const db = load('gm_dev_db', DEV); const R = db.rooms[p.code]; if (!R) throw new Error('Phòng đã đóng'); if (p.st.qid !== R.st.qid) R.openAt = Date.now(); R.st = p.st; R.v++; store('gm_dev_db', db); return { v: R.v }; }
    case 'roomPull': { const db = load('gm_dev_db', DEV); const R = db.rooms[p.code] || { players: [], ans: {}, st: {} }; return { players: R.players, answers: R.ans[p.qid || R.st.qid] || {} }; }
    case 'roomClose': { const db = load('gm_dev_db', DEV); delete db.rooms[p.code]; store('gm_dev_db', db); return true; }
  }
  throw new Error('Lệnh thử chưa hỗ trợ: ' + a);
}

/* ---------- thông báo & hộp thoại ---------- */
function toast(msg, bad, ms) {
  const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.innerHTML = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms || (bad ? 6000 : 2800));
}
function modal(o) {
  const m = document.createElement('div'); m.className = 'mask';
  m.innerHTML = `<div class="modal ${o.wide ? 'wide' : ''}"><div class="mh"><h2>${o.title || ''}</h2><button class="x" data-x>×</button></div><div class="mb">${o.body || ''}</div>${o.foot ? `<div class="mf">${o.foot}</div>` : ''}</div>`;
  (o.parent || document.body).appendChild(m);

function makeTimer(host, sec, o) {

  el.innerHTML = `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" stroke="rgba(255,255,255,.12)" stroke-width="9" fill="rgba(0,0,0,.35)"/><circle cx="50" cy="50" r="44" stroke="var(--brand2)" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg><div class="n"></div>`;

  const T = {
    el, get left() { return left; }, get total() { return total; },
    stop() { dead = true; el.remove(); }, pause() { run = false; }, resume() { run = true; last = performance.now(); }, toggle() { run ? T.pause() : T.resume(); return run; },
    add(s) { left += s; total = Math.max(total, left); }, get running() { return run; }
  };

    last = t;
    const s = Math.ceil(Math.max(0, left)); num.textContent = o.hide ? '?' : s;
    ring.style.strokeDashoffset = 276.5 * (1 - Math.max(0, left) / total);
    ring.style.stroke = left / total < .25 ? 'var(--bad)' : left / total < .5 ? 'var(--acc)' : 'var(--brand2)';
    el.classList.toggle('hurry', left <= 5 && left > 0 && !o.hide);

    requestAnimationFrame(f);

}

    every(ms, f) { const id = setInterval(f, ms); K.timers.push(id); return id; },
    loop(f) { const L = { on: true }; K.loops.push(L); let last = performance.now(); (function r(t) { if (!L.on) return; const dt = Math.min(0.05, (t - last) / 1000); last = t; if (f(dt, t) !== false) requestAnimationFrame(r); })(last); return L; },
    clearTimers() { K.timers.forEach(id => { clearTimeout(id); clearInterval(id); }); K.timers = []; K.loops.forEach(L => L.on = false); K.loops = []; },
    key(f) { K.keys.push(f); },

    ctx.clearTimers(); ctx.stopTimer(); K.keys = []; K.cleanups.forEach(f => { try { f(); } catch (e) {} }); K.cleanups = []; BEAT.stop(); MIC.stop();
    ctx.el.innerHTML = ''; ctx.btns([]); ctx.status(''); ctx._onScore = null; ctx._run = (ctx._run || 0) + 1; $$('#stage > .ovl').forEach(o => o.remove());

  st.addEventListener('mousemove', wake); wake();
  K.cleanups.push(() => clearTimeout(idleT));
  STAGE.kd = e => {
    if (!$('#stage') || e.target.closest('input,textarea,select')) return;
    if ($('#stage .ovl') && !e.defaultPrevented && ['Escape'].indexOf(e.key) < 0 && !/^[1-8]$/.test(e.key)) { /* lớp phủ đang mở: để lớp phủ tự xử lý */ }
    for (let i = K.keys.length - 1; i >= 0; i--) if (K.keys[i](e) === true) { e.preventDefault(); return; }
    const b = (ctx._btnKeys || []).find(x => x.k === e.key || (x.k.length === 1 && x.k.toLowerCase() === e.key.toLowerCase()));
    if (b) { e.preventDefault(); SFX.ctx(); b.f(); return; }
    const d = e.code && /^Digit[1-8]$/.test(e.code) ? +e.code.slice(5) : (/^[1-8]$/.test(e.key) ? +e.key : 0);
    if (d && d <= S.cls.teams.length) { e.preventDefault(); addScore(d - 1, e.shiftKey ? -1 : 1); return; }

/* ---------- micro: đo âm lượng & bắt tiếng vỗ tay ---------- */
const MIC = (() => {
  let stream = null, an = null, buf = null, src = null;
  return {
    async start() {
      if (an) return true;
      try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } }); }
      catch (e) { toast('Không mở được micro – bấm biểu tượng 🔒 trên thanh địa chỉ, cho phép Micro rồi chơi lại.', true, 7000); return false; }
      const c = SFX.ctx(); src = c.createMediaStreamSource(stream); an = c.createAnalyser(); an.fftSize = 1024; buf = new Float32Array(an.fftSize); src.connect(an); return true;
    },
    level() { if (!an) return 0; an.getFloatTimeDomainData(buf); let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i]; return Math.sqrt(s / buf.length); },
    stop() { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; an = null; src = null; },
    get on() { return !!an; }
  };
})();

function makePool(items) {
  items = (items || []).filter(Boolean);
  const by = t => items.filter(x => x.t === t);
  const ansText = x => x.t === 'mc' ? x.o[x.a] : x.t === 'tf' ? (x.a ? 'Đúng' : 'Sai') : x.t === 'num' ? fmtNum(x.a) + (x.u ? ' ' + x.u : '') : x.t === 'fab' ? x.b : String(x.a || '');

    all: items, size: items.length, ansText, qText,
    /** câu nhiều lựa chọn (tự sinh đáp án nhiễu cho câu trả lời ngắn / con số) */
    mc(n, k) {

        if (x.t === 'mc' && x.o && x.o.length >= 2) { const idx = shuffle(x.o.map((_, i) => i)).slice(0, Math.max(k, 2)); if (idx.indexOf(x.a) < 0) idx[0] = x.a; const s = shuffle(idx); out.push({ q: x.q, o: s.map(i => x.o[i]), a: s.indexOf(x.a), e: x.e, src: x }); }
        else if (x.t === 'tf') out.push({ q: x.q, o: ['Đúng', 'Sai'], a: x.a ? 0 : 1, e: x.e, src: x, tf: true });
        else if (x.t === 'num') { const o = numOpts(x.a, k); out.push({ q: x.q, o: o.map(v => fmtNum(v) + (x.u ? ' ' + x.u : '')), a: o.indexOf(x.a), e: x.e, src: x }); }
        else if (x.t === 'open' || x.t === 'fab') {
          const right = ansText(x), pool = shuffle(items.filter(y => y !== x && y.t === x.t).map(ansText).filter(v => v && norm(v) !== norm(right)));
          if (pool.length >= 1) { const o = shuffle([right].concat(pool.slice(0, k - 1))); out.push({ q: qText(x), o, a: o.indexOf(right), e: x.e, src: x }); }
        }

    },
    /** câu đúng/sai: { q, claim?, a:true|false } */
    tf(n) {
      const out = [];
      shuffle(items).forEach(x => {
        if (x.t === 'tf') out.push({ q: x.q, a: !!x.a, e: x.e, src: x });
        else if (x.t === 'mc' && x.o) { const ok = Math.random() < .5 || x.o.length < 2; const wrong = x.o.filter((_, i) => i !== x.a); out.push({ q: x.q, claim: ok ? x.o[x.a] : pick(wrong), a: ok, e: (x.e ? x.e + ' ' : '') + 'Đáp án đúng: ' + x.o[x.a], src: x }); }
        else if (x.t === 'num') { const ok = Math.random() < .5; const v = ok ? x.a : pick(numOpts(x.a, 4).filter(v => v !== x.a)); out.push({ q: x.q, claim: fmtNum(v) + (x.u ? ' ' + x.u : ''), a: ok, e: 'Đáp án đúng: ' + fmtNum(x.a) + (x.u ? ' ' + x.u : ''), src: x }); }
        else if (x.t === 'fab') { const other = items.filter(y => y.t === 'fab' && y !== x); const ok = Math.random() < .5 || !other.length; out.push({ q: '“' + x.f + '” giúp khách:', claim: ok ? x.b : pick(other).b, a: ok, e: 'Lợi ích đúng: ' + x.b, src: x }); }
        else if (x.t === 'open') { const other = items.filter(y => y.t === 'open' && y !== x); const ok = Math.random() < .5 || !other.length; out.push({ q: x.q, claim: ok ? x.a : pick(other).a, a: ok, e: 'Đáp án đúng: ' + x.a, src: x }); }
      });
      return n ? out.slice(0, n) : out;
    },
    /** câu hỏi – đáp án ngắn để hô to */
    open(n) { const out = shuffle(items).map(x => ({ q: qText(x), a: ansText(x), e: x.e, src: x })).filter(x => x.q && x.a); return n ? out.slice(0, n) : out; },
    num(n) { const out = shuffle(by('num')); return n ? out.slice(0, n) : out; },
    fab(n) { let out = shuffle(by('fab')); if (!out.length) out = shuffle(SAMPLE_SET.items.filter(x => x.t === 'fab')); return n ? out.slice(0, n) : out; },
    /** từ khoá ngắn (đáp án ngắn, F, đáp án đúng của câu nhiều lựa chọn) */
    kw(n) {
      const s = new Set();

    },
    /** từ nhiễu: các đáp án sai */
    wrongs() { const s = new Set(); items.forEach(x => { if (x.t === 'mc' && x.o) x.o.forEach((o, i) => { if (i !== x.a && short(o)) s.add(o); }); }); return shuffle(Array.from(s)); },
    /** cặp ghép trái – phải */
    pairs(n) {

/* ---- 79. ô chữ tìm từ ---- */
function wordsearchEngine(ctx) {
  let words = lines(ctx.cfgv('words', '')); if (!words.length) words = ctx.items.kw(); if (words.length < 4) words = LISTS.feats;
  const N = +ctx.cfgv('size', 12);
  words = shuffle(words).map(w => ({ w, p: plain(w) })).filter(x => x.p.length >= 3 && x.p.length <= N).slice(0, +ctx.cfgv('n', 10));
  const G = Array.from({ length: N }, () => Array(N).fill('')); const dirs = [[0, 1], [1, 0], [1, 1], [-1, 1]]; const placed = [];
  words.forEach(x => {
    for (let t = 0; t < 300; t++) {
      const [dr, dc] = pick(dirs), L = x.p.length, r = rint(0, N - 1), c = rint(0, N - 1), er = r + dr * (L - 1), ec = c + dc * (L - 1);
      if (er < 0 || er >= N || ec < 0 || ec >= N) continue;
      let ok = true; for (let k = 0; k < L; k++) { const ch = G[r + dr * k][c + dc * k]; if (ch && ch !== x.p[k]) { ok = false; break; } }
      if (!ok) continue; const cells = []; for (let k = 0; k < L; k++) { G[r + dr * k][c + dc * k] = x.p[k]; cells.push((r + dr * k) * N + c + dc * k); } placed.push({ w: x.w, cells }); break;
    }
  });
  const AL = 'ABCDEGHIKLMNOPQRSTUVXY'; for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!G[r][c]) G[r][c] = pick(AL.split(''));
  const found = new Set();
  const draw = () => {
    const hl = new Map(); placed.forEach((p, j) => { if (found.has(j)) p.cells.forEach(c => hl.set(c, TEAM_COLORS[j % 8])); });
    const cs = Math.min(64 / N, 90 / N * (innerWidth / innerHeight > 1.4 ? 1 : .7));
    ctx.html(`<div style="display:flex;gap:3vw;align-items:center;justify-content:center;width:100%;height:100%"><div style="display:grid;grid-template-columns:repeat(${N},${cs}vh);gap:3px">${G.flat().map((ch, k) => `<div style="width:${cs}vh;height:${cs}vh;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:${cs * .6}vh;border-radius:6px;background:${hl.get(k) || 'rgba(255,255,255,.06)'};color:${hl.get(k) ? '#081022' : '#fff'};transition:.3s">${ch}</div>`).join('')}</div>
      <div style="display:flex;flex-direction:column;gap:1vh;min-width:22vw"><div class="sm2">Từ cần tìm · ${found.size}/${placed.length}</div>${placed.map((p, j) => `<button class="btn" data-j="${j}" style="justify-content:flex-start;font-size:2.4vh;${found.has(j) ? 'background:' + TEAM_COLORS[j % 8] + ';color:#081022' : ''}">${found.has(j) ? '✓ ' + esc(p.w) : `${j + 1}. ${'•'.repeat(p.w.replace(/\s/g, '').length)} (${plain(p.w).length})`}</button>`).join('')}</div></div>`);
    $$('[data-j]').forEach(b => b.onclick = () => { const j = +b.dataset.j; if (found.has(j)) return; found.add(j); SFX.ok(); draw(); if (found.size === placed.length) { SFX.fanfare(); confetti(2500); } });
  };
  draw(); ctx.timer(+ctx.cfgv('sec', 300), {});
  ctx.btns([{ t: '👁 Hiện hết', k: 'Enter', f: () => { placed.forEach((_, j) => found.add(j)); draw(); } }]);
  ctx.status('Đội hô từ tìm được → trainer bấm vào từ đó ở cột bên phải, rồi cộng điểm đội');
}

  pool = extra.concat(shuffle(pool));
  const rows = [], used = new Set();
  key.split('').forEach(ch => { const j = pool.findIndex((x, k) => !used.has(k) && x.p.indexOf(ch) >= 0); if (j >= 0) { used.add(j); rows.push(Object.assign({ at: pool[j].p.indexOf(ch) }, pool[j])); } else rows.push({ q: '(Thiếu câu có chữ “' + ch + '” – thêm ở ⚙️ Cài đặt)', a: ch, p: ch, at: 0 }); });
  const keyCol = Math.max(...rows.map(r => r.at)); const open = new Set(); let keyOpen = false, cur = -1;

      <div style="flex:1;display:flex;flex-direction:column;gap:2vh;justify-content:center" id="cq">${cur >= 0 ? `<div class="sm2">Hàng ${cur + 1} · ${rows[cur].p.length} chữ</div><div class="mid">${esc(rows[cur].q)}</div>` : `<div class="mid">Chọn hàng ngang (bấm số thứ tự)</div><div class="sm2">Từ khoá hàng dọc có ${key.length} chữ – đoán ra sớm được 5 điểm!</div>`}</div></div>`);
    $$('[data-r]').forEach(el => el.onclick = () => { cur = +el.dataset.r; SFX.pop(); draw(); ctx.timer(+ctx.cfgv('sec', 20), { host: $('#cq') }); });
  };
  draw();
  ctx.btns([{ t: '👁 Mở hàng đang chọn', k: 'Enter', f: () => { if (cur < 0) return; open.add(cur); SFX.ok(); ctx.stopTimer(); draw(); } }, { t: '🔑 Mở từ khoá hàng dọc', f: () => { keyOpen = true; SFX.fanfare(); confetti(2500); draw(); $('#cq').innerHTML = `<div class="sm2">Từ khoá hôm nay</div><div class="big pop" style="color:var(--acc)">${esc(ctx.cfgv('key', 'OPPO'))}</div>`; } }]);

/* ---- 71, 72. từ khoá bay / mưa thông số ---- */
function flyEngine(ctx, mode) {
  const P = ctx.items;
  let good, bad, label;
  if (mode === 'rain') {
    const T = P.tf().filter(x => x.claim != null || x.q.length < 60);
    good = T.filter(x => x.a).map(x => x.claim != null ? x.q.replace(/[?:]\s*$/, '') + ': ' + x.claim : x.q);
    bad = T.filter(x => !x.a).map(x => x.claim != null ? x.q.replace(/[?:]\s*$/, '') + ': ' + x.claim : x.q);
    label = ctx.cfgv('label', 'Hô “ĐÚNG!” khi thấy thông tin đúng');
  } else {
    good = lines(ctx.cfgv('good', '')); bad = lines(ctx.cfgv('bad', ''));
    if (!good.length) good = P.kw(); if (!bad.length) bad = P.wrongs().concat(['Tủ lạnh', 'Máy giặt', 'Xe đạp', 'Bánh mì', 'Trà sữa', 'Kem', 'Quạt máy']);
    label = ctx.cfgv('label', 'Đọc to từ khoá thuộc chủ đề bài học');
  }
  if (!good.length) { ctx.html('<div class="center"><div class="mid">Chưa có từ khoá – nhập ở ⚙️ Cài đặt</div></div>'); return; }
  const lvl = { v: 1 }, items = [];
  ctx.html(`<div style="position:absolute;inset:0" id="fz"></div><div class="chip" style="position:absolute;top:1.5vh;left:50%;transform:translateX(-50%);z-index:3;font-size:2.6vh">🎯 ${esc(label)}</div>`);
  const fz = $('#fz'), W = () => fz.clientWidth, H = () => fz.clientHeight;
  const spawn = () => {
    const isGood = Math.random() < .55, txt = isGood ? pick(good) : pick(bad); const d = document.createElement('div');
    const sz = rnd(2.6, 5.4); d.style.cssText = `position:absolute;white-space:nowrap;font-weight:900;font-size:${sz}vh;padding:.6vh 1.2vw;border-radius:14px;cursor:pointer;user-select:none;background:${pick(['rgba(61,139,255,.25)', 'rgba(255,91,200,.25)', 'rgba(46,229,157,.2)', 'rgba(255,207,51,.2)', 'rgba(155,107,255,.25)'])};border:2px solid rgba(255,255,255,.25)`;
    d.textContent = txt; fz.appendChild(d);
    const it = { d, good: isGood, x: 0, y: 0, vx: 0, vy: 0, w: 0 };
    it.w = d.offsetWidth;
    if (mode === 'rain') { it.x = rnd(10, W() - it.w - 10); it.y = -60; it.vx = 0; it.vy = rnd(60, 120) * lvl.v; }
    else { const side = rint(0, 3), sp = rnd(90, 190) * lvl.v; if (side === 0) { it.x = -it.w; it.y = rnd(60, H() - 60); it.vx = sp; it.vy = rnd(-60, 60); } else if (side === 1) { it.x = W(); it.y = rnd(60, H() - 60); it.vx = -sp; it.vy = rnd(-60, 60); } else if (side === 2) { it.x = rnd(0, W() - it.w); it.y = -50; it.vx = rnd(-80, 80); it.vy = sp * .7; } else { it.x = rnd(0, W() - it.w); it.y = H(); it.vx = rnd(-80, 80); it.vy = -sp * .7; } it.turn = rnd(1, 3); }
    d.onclick = () => { d.style.transition = '.25s'; d.style.transform = 'scale(1.6)'; d.style.opacity = 0; d.style.background = it.good ? 'var(--ok)' : 'var(--bad)'; it.dead = true; it.good ? SFX.ok() : SFX.bad(); setTimeout(() => d.remove(), 260); };
    items.push(it);
  };
  let acc = 0, run = false;
  ctx.loop(dt => {
    if (!run) return; acc += dt; const every = Math.max(.35, 1.3 / lvl.v);
    if (acc > every) { acc = 0; spawn(); }
    items.forEach(it => {
      if (it.dead) return;
      if (mode !== 'rain') { it.turn -= dt; if (it.turn < 0) { it.turn = rnd(1, 2.5); const a = Math.atan2(it.vy, it.vx) + rnd(-1, 1), s = Math.hypot(it.vx, it.vy); it.vx = Math.cos(a) * s; it.vy = Math.sin(a) * s; it.d.style.fontSize = rnd(2.4, 6) + 'vh'; } }
      it.x += it.vx * dt; it.y += it.vy * dt; it.d.style.transform = `translate(${it.x}px,${it.y}px)`;
      if (it.x < -it.w - 80 || it.x > W() + 80 || it.y < -120 || it.y > H() + 60) { it.dead = true; it.d.remove(); }
    });
    for (let k = items.length - 1; k >= 0; k--) if (items[k].dead) items.splice(k, 1);

  ctx.status('Bấm vào chữ để “bắt” – xanh là đúng, đỏ là sai · phím số cộng điểm đội hô đúng trước');
}

/* ---- 80. lật thẻ trí nhớ ---- */
function memoryEngine(ctx) {
  let pairs = ctx.items.pairs(8); if (pairs.length < 4) pairs = makePool(SAMPLE_SET.items).pairs(8);
  pairs = pairs.slice(0, +ctx.cfgv('pairs', 8));
  const cards = shuffle(pairs.flatMap((p, j) => [{ j, t: p[0], s: 'L' }, { j, t: p[1], s: 'R' }]));
  let open = [], done = new Set(), team = 0, lock = false;
  const cols = cards.length > 12 ? 4 : 4, rows = Math.ceil(cards.length / cols);
  const draw = () => {
    ctx.html(`<div style="display:flex;flex-direction:column;align-items:center;gap:1vh;width:100%;height:100%;padding:1vh 2vw"><div class="mid" style="font-size:3vh">Lượt: <b style="color:${S.cls.teams[team].color}">${esc(S.cls.teams[team].name)}</b> · lật 2 thẻ (tính năng ↔ thông số / lợi ích)</div>
      <div style="display:grid;grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr);gap:1vh;width:min(96vw,150vh);flex:1">${cards.map((c, k) => `<div class="tile ${open.indexOf(k) >= 0 || done.has(c.j) ? 'open' : ''}" data-k="${k}" style="cursor:pointer;${done.has(c.j) ? 'opacity:.55' : ''}"><div class="in"><div class="fr">${k + 1}</div><div class="bk" style="${c.s === 'L' ? 'background:linear-gradient(145deg,#ffe28a,#ffcf33)' : ''}">${esc(c.t)}</div></div></div>`).join('')}</div></div>`);
    $$('[data-k]').forEach(el => el.onclick = () => flip(+el.dataset.k));
  };
  const flip = k => {
    if (lock || open.indexOf(k) >= 0 || done.has(cards[k].j)) return; open.push(k); SFX.flip(); draw();
    if (open.length === 2) {
      lock = true; const [a, b] = open.map(x => cards[x]);
      ctx.after(1300, () => { if (a.j === b.j && a.s !== b.s) { done.add(a.j); addScore(team, 1); SFX.ok(); } else { SFX.bad(); team = (team + 1) % S.cls.teams.length; } open = []; lock = false; draw(); if (done.size === pairs.length) ctx.celebrate(); });
    }
  };
  draw(); ctx.btns([{ t: '👁 Lật hết', f: () => { pairs.forEach((_, j) => done.add(j)); draw(); } }]);
}

      <div style="width:min(1400px,92vw);display:flex;flex-direction:column;gap:1.4vh">${T.map((t, k) => `<div style="display:flex;align-items:center;gap:1vw"><b style="color:${t.color};width:12vw;text-align:right;font-size:2.4vh">${esc(t.name)}</b>${slider ? `<input type="range" min="0" max="${max}" step="${max / 200}" value="${guess[k]}" data-k="${k}" style="flex:1;accent-color:${t.color};height:4vh">` : `<input class="inp" type="number" data-k="${k}" placeholder="Nhập số đoán" style="flex:1;font-size:3vh;max-width:30vw">`}<b data-v="${k}" style="width:10vw;font-size:3vh">${slider ? fmtNum(guess[k]) : ''}</b></div>`).join('')}</div>

    $$('input[data-k]').forEach(el => el.oninput = () => { const k = +el.dataset.k; guess[k] = Number(el.value); const v = $(`[data-v="${k}"]`); if (v && slider) v.textContent = fmtNum(Math.round(guess[k] * 10) / 10); });
    ctx.timer(+ctx.cfgv('sec', 30), {});
    if (ctx.room) roomSend({ kind: 'number', q: q.q + (q.u ? ' (' + q.u + ')' : ''), qid: 'n' + i + Date.now().toString(36), open: true });
  };
  const show = async () => {
    const q = Q[i]; if (!q) return; ctx.stopTimer(); $('#ans').classList.remove('hidden'); $('#ans').classList.add('pop');
    const d = guess.map((g, k) => ({ k, d: Math.abs((Number.isFinite(g) ? g : 1e18) - q.a) })).sort((a, b) => a.d - b.d);
    const best = d.filter(x => x.d === d[0].d);
    best.forEach(b => { addScore(b.k, +ctx.cfgv('pts', 2)); const el = $(`[data-v="${b.k}"]`); if (el) el.textContent = '🏆 ' + (el.textContent || ''); });
    SFX.ok(); confetti(1500);
    if (ctx.room) { const res = await roomCollect(); if (res) { const arr = Object.entries(res.answers).map(([pid, a]) => ({ pid, d: Math.abs(Number(a.a) - q.a) })).filter(x => Number.isFinite(x.d)).sort((a, b) => a.d - b.d); const top = arr.slice(0, 3).map(x => (res.players.find(p => p.id === x.pid) || {}).name).filter(Boolean); if (top.length) $('#ans').insertAdjacentHTML('afterend', `<div class="mid">📱 Gần nhất: ${top.map(esc).join(', ')}</div>`); roomScore(res, a => Math.abs(Number(a) - q.a) <= arr[0].d); } }
  };
  ctx.html(`<div class="center"><div style="font-size:14vh">${slider ? '🎚️' : '💰'}</div><div class="big">${esc(ctx.g.name)}</div><div class="sm2">Mỗi đội đưa ra con số đoán – đội gần đúng nhất ghi ${ctx.cfgv('pts', 2)} điểm</div></div>`);
  ctx.btns([{ t: '▶ Bắt đầu', k: ' ', f: () => { next(); ctx.btns([{ t: '👁 Mở đáp án', k: 'Enter', f: show, c: 'pri' }, { t: 'Câu tiếp ▶', k: 'ArrowRight', f: next }]); }, c: 'pri' }]);
}

/* ---- 73. chớp mắt là mất ---- */

  const round = async () => {
    const g0 = ctx.guard(), my = ++tok, alive = () => g0() && my === tok; ctx.clearTimers(); const set = O.slice(i, i + 4); i += 4; if (set.length < 2) { i = 0; return ctx.celebrate(); }
    const ask = pick(set);
    ctx.html(`<div class="center"><div class="big" id="cd">Nhìn kỹ…</div></div>`);
    for (const n of [3, 2, 1]) { if (!alive() || !$('#cd')) return; $('#cd').textContent = n; SFX.tick(); await sleep(650); }
    ctx.html(`<div class="center"><div class="card" style="width:min(1300px,92vw);font-size:3.6vh;text-align:left;background:#fff;color:#0b1020">${set.map(x => `<div style="padding:1vh 0;border-bottom:1px solid #ddd"><b>${esc(x.q.replace(/\?$/, ''))}</b>: ${esc(x.a)}</div>`).join('')}</div></div>`); SFX.shutter();

  };

  ctx.btns([{ t: '▶ Lượt tiếp', k: ' ', f: round, c: 'pri' }, { t: '👁 Đáp án', k: 'Enter', f: () => { const a = $('#ans'); if (a) { a.classList.remove('hidden'); a.classList.add('pop'); SFX.ok(); ctx.stopTimer(); } } }]);
}

/* ---- 24. so kè đối thủ (bảng đục lỗ) ---- */
function tableEngine(ctx) {
  const raw = lines(ctx.cfgv('table', 'Tiêu chí | Máy mình | SS | Xi | VV\nPin | 5000mAh | 4500mAh | 5000mAh | 4800mAh\nSạc nhanh | 80W | 25W | 67W | 44W\nMàn hình | 120Hz | 90Hz | 120Hz | 120Hz\nKháng nước | IP68 | IP67 | IP54 | IP54'));
  const rows = raw.map(l => l.split('|').map(s => s.trim()));
  if (rows.length < 2) { ctx.html('<div class="center"><div class="mid">Nhập bảng so sánh ở ⚙️ Cài đặt</div></div>'); return; }
  const holes = new Set(); const pct = +ctx.cfgv('holes', 45) / 100;
  rows.slice(1).forEach((r, i) => r.slice(1).forEach((_, j) => { if (Math.random() < pct) holes.add((i + 1) + ':' + (j + 1)); }));
  const draw = () => ctx.html(`<div class="center"><div class="mid">So kè đối thủ – điền ô trống</div><table style="border-collapse:separate;border-spacing:6px;font-size:clamp(16px,2.4vw,40px);font-weight:800">${rows.map((r, i) => `<tr>${r.map((c, j) => { const h = holes.has(i + ':' + j); return `<td data-c="${i}:${j}" style="padding:1.2vh 1.6vw;border-radius:12px;text-align:center;cursor:${h ? 'pointer' : 'default'};background:${i === 0 ? 'var(--brand)' : j === 0 ? 'rgba(255,255,255,.12)' : h ? 'rgba(255,207,51,.18)' : 'rgba(255,255,255,.06)'};color:${i === 0 ? '#03140b' : '#fff'};${j === 1 && i > 0 ? 'border:3px solid var(--brand)' : ''}">${h ? '❓' : esc(c)}</td>`; }).join('')}</tr>`).join('')}</table><div class="sm2">Đội trả lời đúng ô nào – trainer bấm ô đó để mở, rồi cộng điểm (phím số)</div></div>`);
  draw();
  ctx.el.onclick = e => { const td = e.target.closest('[data-c]'); if (td && holes.has(td.dataset.c)) { holes.delete(td.dataset.c); SFX.ok(); draw(); } };
  ctx.timer(+ctx.cfgv('sec', 300), {});
  ctx.btns([{ t: '👁 Mở hết', k: 'Enter', f: () => { holes.clear(); draw(); SFX.fanfare(); } }]);
}

/* ===== 44_fab.js ===== */

   KHUÔN 5 – LUYỆN TƯ VẤN FAB (nhóm D)
   F = điểm nhấn / thông số · A = ưu điểm, lợi thế · B = lợi ích cho khách
   Chấm 3 sao: ⭐ F đúng · ⭐ A nói được lợi thế · ⭐ B chạm đúng nhu cầu
   ========================================================= */
function fabEngine(ctx, mode) {
  const alive = ctx.guard();
  const F = ctx.items.fab(); let fi = -1, stars = [0, 0, 0], cur = null, special = null;
  const T = S.cls.teams;
  const starsHtml = () => `<div class="row" style="justify-content:center;gap:1.4vw" id="stars">${['F đúng', 'A lợi thế', 'B chạm nhu cầu'].map((l, k) => `<button class="btn lg" data-s="${k}" style="font-size:3vh;${stars[k] ? 'background:var(--acc);color:#241a00' : ''}">${stars[k] ? '⭐' : '☆'} ${l} <span class="kbd">${'FAB'[k]}</span></button>`).join('')}</div>
    <div class="row" style="justify-content:center" id="award">${T.map((t, i) => `<button class="btn" data-aw="${i}" style="border-color:${t.color};color:${t.color}">+${stars.reduce((a, b) => a + b, 0)}⭐ ${esc(t.name)}</button>`).join('')}</div>`;
  const bindStars = () => {
    $$('[data-s]').forEach(b => b.onclick = () => toggleStar(+b.dataset.s));
    $$('[data-aw]').forEach(b => b.onclick = () => { const n = stars.reduce((a, b) => a + b, 0); if (!n) return; addScore(+b.dataset.aw, n); stars = [0, 0, 0]; refreshStars(); });
  };
  const refreshStars = () => { const s = $('#starsBox'); if (s) { s.innerHTML = starsHtml(); bindStars(); } };
  const toggleStar = k => { stars[k] = stars[k] ? 0 : 1; stars[k] ? SFX.ding() : SFX.minus(); refreshStars(); if (stars.every(Boolean)) { confetti(1500); SFX.fanfare(); } };
  ctx.key(e => { const k = 'fab'.indexOf(String(e.key).toLowerCase()); if (k >= 0 && $('#starsBox') && !e.ctrlKey) { toggleStar(k); return true; } return false; });
  const card = (x, o) => {
    o = o || {};
    const part = (lab, txt, col, hid, id) => `<div style="flex:1;min-width:24vw;background:rgba(255,255,255,.06);border:3px solid ${col};border-radius:20px;padding:1.6vh 1.4vw;text-align:left"><div style="font-weight:900;color:${col};font-size:2.6vh">${lab}</div><div id="${id}" style="font-weight:800;font-size:${id === 'pF' ? '4.6vh' : '3.2vh'};line-height:1.25;margin-top:.6vh">${hid ? '<span style="opacity:.35">? ? ?</span>' : esc(txt)}</div></div>`;
    return `<div style="display:flex;gap:1.2vw;width:min(1500px,94vw);flex-wrap:wrap">${part('F · Điểm nhấn / thông số', x.f, '#ffcf33', o.hideF, 'pF')}${o.noAB ? '' : part('A · Ưu điểm, lợi thế', x.a, '#3d8bff', o.hideA !== false, 'pA') + part('B · Lợi ích cho khách', x.b, '#2ee59d', o.hideB !== false, 'pB')}</div>`;
  };
  const showAB = (x) => { const a = $('#pA'), b = $('#pB'), f = $('#pF'); if (a) a.textContent = x.a; if (b) b.textContent = x.b; if (f) f.textContent = x.f; SFX.ok(); };
  const baseBtns = (extra) => ctx.btns((extra || []).concat([{ t: '👁 Mẫu A – B', k: 'Enter', f: () => cur && showAB(cur) }, { t: 'Lượt tiếp ▶', k: 'ArrowRight', f: next }]));
  const stage = (top, x, o, sec, bottom) => {
    stars = [0, 0, 0]; cur = x;
    ctx.html(`<div class="center" style="gap:1.8vh">${top || ''}${card(x, o)}${bottom || ''}<div id="starsBox"></div></div>`); refreshStars();
    if (sec) ctx.timer(sec, {});
  };
  const nextF = () => { fi++; return F[fi % F.length]; };
  async function next() {
    if (!alive()) return; ctx.clearTimers(); ctx.stopTimer(); special = null;
    const sec = +ctx.cfgv('sec', 30);
    switch (mode) {
      case 'tiles': case 'secret': return tilesBoard();
      case 'relay': return relay();
      case 'persona': { const x = nextF(); const p = await spinWheel(LISTS.personas.concat(lines(ctx.cfgv('personas', ''))).slice(0, 12), { title: 'Khách hàng là ai?', fast: true }); if (!alive()) return; stage(`<div class="mid">🧑 Khách: <span style="color:var(--acc)">${esc(p ? p.item.label : '')}</span></div>`, x, {}, sec, '<div class="sm2">Cùng 1 F – mỗi kiểu khách phải nhận 1 lợi ích B khác nhau</div>'); baseBtns([{ t: '🧑 Khách khác (cùng F)', k: 'p', f: async () => { fi--; next(); } }]); return; }
      case 'missing': { const x = nextF(); const hideA = Math.random() < .5; stage(`<div class="mid">Điền mắt xích bị thiếu! Đội giành quyền: bấm phím số</div>`, x, { hideA: hideA, hideB: !hideA }, 0); baseBtns(); return; }
      case 'oneBreath': { const x = nextF(); stage(`<div class="mid">Nói gọn 1 câu trong ${ctx.cfgv('sec', 10)} giây</div>`, x, { noAB: false }, +ctx.cfgv('sec', 10), `<div class="expl" style="font-size:3vh">“Máy có <b>${esc(x.f)}</b> nên <b>…(A)…</b>, giúp anh/chị <b>…(B)…</b>”</div>`); baseBtns(); return; }
      case 'reverse': { const x = nextF(); stars = [0, 0, 0]; cur = x; ctx.html(`<div class="center"><div class="sm2">Khách nói:</div><div class="big pop" style="color:var(--acc)">“${esc(x.n || ('Em cần ' + x.b.toLowerCase()))}”</div><div class="sm2">Đội tìm F phù hợp rồi nói đủ A và B</div><div id="rv" class="hidden">${card(x, { hideA: false, hideB: false })}</div><div id="starsBox"></div></div>`); refreshStars(); ctx.timer(sec, {}); ctx.btns([{ t: '👁 Gợi ý F – A – B', k: 'Enter', f: () => { $('#rv').classList.remove('hidden'); SFX.ok(); } }, { t: 'Lượt tiếp ▶', k: 'ArrowRight', f: next }]); return; }
      case 'versus': { const x = nextF(); const c = await spinWheel(lines(ctx.cfgv('comp', LISTS.competitors.join('\n'))), { title: 'Khách đang so với máy nào?', fast: true }); if (!alive()) return; stage(`<div class="mid">⚔️ Khách đang so với <span style="color:var(--bad)">${esc(c ? c.item.label : '')}</span> – A phải là lợi thế so với đúng máy đó</div>`, x, {}, sec); baseBtns(); return; }
      case 'doubleWheel': { const f = await spinWheel(F.map(x => x.f).slice(0, 12), { title: 'Vòng 1 – Tính năng', fast: true }); if (!alive() || !f) return; const p = await spinWheel(LISTS.personas.slice(0, 10), { title: 'Vòng 2 – Kiểu khách', fast: true }); if (!alive()) return; const x = F.find(z => z.f === f.item.label) || F[0]; stage(`<div class="mid">🧑 ${esc(p ? p.item.label : '')}</div>`, x, {}, sec); baseBtns(); return; }
      case 'image': { const ims = (ctx.cfg.images || []); const x = nextF(); const im = ims.length ? ims[fi % ims.length] : null; stars = [0, 0, 0]; cur = x; ctx.html(`<div style="display:flex;gap:2vw;width:100%;height:100%;padding:2vh 2vw;align-items:center"><div style="flex:1;height:84%;border-radius:22px;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center">${im ? `<img src="${im.url}" style="max-width:100%;max-height:100%">` : `<div style="font-size:30vh">${pick(['📸', '🌙', '🔋', '🎮', '🤳'])}</div>`}</div><div style="flex:1;display:flex;flex-direction:column;gap:2vh"><div class="mid">Ảnh này do tính năng nào tạo ra? Nói FAB!</div><div id="iv" class="hidden">${card(im ? { f: im.name, a: '', b: '' } : x, { noAB: !!im, hideA: false, hideB: false })}</div><div id="starsBox"></div></div></div>`); refreshStars(); ctx.timer(sec, {}); ctx.btns([{ t: '👁 Đáp án', k: 'Enter', f: () => { $('#iv').classList.remove('hidden'); SFX.ok(); } }, { t: 'Ảnh tiếp ▶', k: 'ArrowRight', f: next }]); return; }
      case 'story': { const xs = [nextF(), nextF(), nextF()]; stars = [0, 0, 0]; cur = xs[0]; ctx.html(`<div class="center"><div class="mid">Nối 3 tính năng thành 1 màn tư vấn mạch lạc</div><div style="display:flex;gap:1.4vw">${xs.map((x, k) => `<div class="tile" style="width:28vw;height:22vh" id="st${k}"><div class="in"><div class="fr">${k + 1}</div><div class="bk" style="font-size:3.4vh">${esc(x.f)}</div></div></div>`).join('')}</div><div id="starsBox"></div></div>`); refreshStars(); for (let k = 0; k < 3; k++) { await sleep(500); if (!alive()) return; $('#st' + k).classList.add('open'); SFX.flip(); } ctx.timer(+ctx.cfgv('sec', 45), {}); ctx.btns([{ t: 'Lượt tiếp ▶', k: 'ArrowRight', f: next }]); return; }
      case 'bid': return bid();
      case 'noNumbers': { const x = nextF(); const ban = lines(ctx.cfgv('ban', 'MP\nmAh\nHz\nW\nGB\nnit\nchip\nsố liệu bất kỳ')); stage(`<div class="mid">🚫 Cấm nói: <span style="color:var(--bad)">${ban.map(esc).join(' · ')}</span></div>`, x, {}, sec); baseBtns([{ t: '❌ Phạm luật!', k: 'x', c: 'bad', f: () => { SFX.buzz(); ctx.flash('#ff4d6d'); ctx.stopTimer(); } }]); return; }
      case 'elevator': { const x = nextF(); stage(`<div class="mid">🛗 Thang máy 20 giây – bấm F, A, B khi học viên nói xong từng phần</div>`, x, {}, +ctx.cfgv('sec', 20)); baseBtns(); return; }
      case 'soWhat': { const x = nextF(); let k = 0; stage('<div class="mid" id="sw">Tư vấn câu đầu tiên…</div>', x, {}, sec); baseBtns([{ t: '🤨 “Thì sao?”', k: ' ', c: 'acc', f: () => { k++; const s = $('#sw'); s.innerHTML = `<span style="font-size:${6 + k * 2}vh;color:var(--acc)">🤨 Thì sao${'?'.repeat(k + 1)}</span>`; s.classList.remove('pop'); void s.offsetWidth; s.classList.add('pop'); SFX.buzz(); } }]); return; }
      case 'flash': { const x = nextF(); cur = x; ctx.html(`<div class="center"><div class="big" id="ff" style="color:var(--acc)">${esc(x.f)}</div><div class="sm2" id="fh">Nhớ nhanh!</div><div id="starsBox"></div></div>`); SFX.whoosh(); stars = [0, 0, 0]; await sleep(+ctx.cfgv('ms', 2000)); if (!alive()) return; $('#ff').innerHTML = '🙈 ? ? ?'; $('#fh').textContent = 'Đội bấm chuông (phím số) – nói A và B của F vừa rồi'; refreshStars(); baseBtns([{ t: '🔁 Hiện lại F', k: 'r', f: () => { $('#ff').textContent = x.f; } }]); return; }
      case 'workshop': return workshop();
    }
  }
  /* ---- bảng lật ô (51 · 70) ---- */
  function tilesBoard() {
    const n = Math.min(12, F.length), list = F.slice(0, n), flipped = new Set();
    const specials = mode === 'secret' ? shuffle(['×2 điểm', '😤 Khách khó', '🚫 Mất lượt', '🎁 Cho đội bạn'].concat(Array(n).fill(null))).slice(0, n) : Array(n).fill(null);
    const board = () => {
      ctx.html(`<div style="display:flex;gap:2vw;width:100%;height:100%;padding:2vh 2vw"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1.2vh;flex:1.1">${list.map((x, k) => `<div class="tile ${flipped.has(k) ? 'open' : ''}" data-t="${k}" style="cursor:pointer"><div class="in"><div class="fr">${k + 1}</div><div class="bk" style="font-size:2.4vh">${specials[k] ? `<div><div style="font-size:3vh">${specials[k]}</div><div style="font-size:2vh;opacity:.7">${esc(x.f)}</div></div>` : esc(x.f)}</div></div></div>`).join('')}</div>
        <div style="flex:1;display:flex;flex-direction:column;gap:1.6vh;justify-content:center" id="fz"><div class="mid">Quay chọn người → lật 1 ô → ${ctx.cfgv('sec', 30)} giây nói đủ A và B</div></div></div>`);
      $$('[data-t]').forEach(el => el.onclick = () => openTile(+el.dataset.t));
    };
    const openTile = k => {
      if (flipped.has(k)) return; flipped.add(k); const x = list[k]; cur = x; stars = [0, 0, 0]; special = specials[k]; SFX.flip();
      $(`[data-t="${k}"]`).classList.add('open');
      const fz = $('#fz');
      let extra = '';
      if (special === '😤 Khách khó') extra = `<div class="chip" style="color:var(--bad)">Khách vặn: “${esc(pick(LISTS.objections))}”</div>`;
      if (special === '🚫 Mất lượt') { SFX.bad(); ctx.flash('#ff4d6d'); }
      if (special === '×2 điểm') { SFX.fanfare(); }
      fz.innerHTML = `${special ? `<div class="big pop" style="color:var(--acc)">${special}</div>` : ''}<div class="big pop" style="color:var(--acc)">${esc(x.f)}</div>${extra}<div style="display:flex;flex-direction:column;gap:1vh"><div class="chip" style="text-align:left;border-color:#3d8bff">A: <span id="pA" style="opacity:.4">? ? ?</span></div><div class="chip" style="text-align:left;border-color:#2ee59d">B: <span id="pB" style="opacity:.4">? ? ?</span></div></div><div id="starsBox"></div>`;
      refreshStars();
      if (special !== '🚫 Mất lượt') ctx.timer(+ctx.cfgv('sec', 30), { host: fz });
    };
    board();
    ctx.btns([{ t: '🎯 Quay chọn người', k: 'p', f: () => pickName() }, { t: '👁 Mẫu A – B', k: 'Enter', f: () => { if (cur) { $('#pA') && ($('#pA').textContent = cur.a, $('#pA').style.opacity = 1); $('#pB') && ($('#pB').textContent = cur.b, $('#pB').style.opacity = 1); SFX.ok(); } } }]);
    const oldAward = refreshStars;
    if (mode === 'secret') ctx._onScore = (i, d) => { if (special === '×2 điểm' && d > 0) { special = null; addScore(i, d, true); } };
  }
  /* ---- 52 tiếp sức ---- */

/* ---- 21, 53, 112: ghép cặp / ghép bộ ---- */

  else { groups = lines(ctx.cfgv('pairs', '')).map(splitPair).filter(p => p[1]); if (groups.length < 3) groups = groups.concat(ctx.items.pairs(8)); groups = groups.slice(0, +ctx.cfgv('n', 6)); }

  const cols = triple ? 3 : 2, C = Array.from({ length: cols }, (_, c) => shuffle(groups.map((g, j) => ({ j, t: g[c] }))));
  const heads = triple ? ['F · Tính năng', 'A · Ưu điểm', 'B · Lợi ích'] : ctx.cfgv('heads', 'Tính năng | Lợi ích / thông số').split('|').map(s => s.trim());
  const done = new Set(); let sel = [];
  const draw = () => {
    ctx.html(`<div style="position:relative;width:100%;height:100%;padding:2vh 3vw"><svg id="mL" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></svg><div style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:${triple ? 3 : 10}vw;height:100%">${C.map((col, c) => `<div style="display:flex;flex-direction:column;gap:1vh;justify-content:center"><div class="sm2" style="font-weight:800">${esc(heads[c] || '')}</div>${col.map(x => `<div class="opt c${done.has(x.j) ? x.j % 6 : c === 0 ? 1 : c === 1 ? 3 : 2}" data-c="${c}" data-j="${x.j}" style="min-height:8vh;font-size:clamp(14px,1.9vw,30px);padding:1.2vh 1.4vw;cursor:pointer;${done.has(x.j) ? 'opacity:.92;outline:4px solid #fff' : 'background:rgba(255,255,255,.08)'};${sel.some(s => s.c === c && s.j === x.j) ? 'outline:5px solid var(--acc)' : ''}">${esc(x.t)}</div>`).join('')}</div>`).join('')}</div></div>`);
    $$('[data-c]').forEach(el => el.onclick = () => choose(+el.dataset.c, +el.dataset.j, el));
    lines_();
  };
  const lines_ = () => {
    const svg = $('#mL'); if (!svg) return; const R = svg.getBoundingClientRect(); let h = '';
    done.forEach(j => { for (let c = 0; c + 1 < cols; c++) { const a = $(`[data-c="${c}"][data-j="${j}"]`).getBoundingClientRect(), b = $(`[data-c="${c + 1}"][data-j="${j}"]`).getBoundingClientRect(); h += `<line x1="${a.right - R.left}" y1="${a.top + a.height / 2 - R.top}" x2="${b.left - R.left}" y2="${b.top + b.height / 2 - R.top}" stroke="${TEAM_COLORS[j % 8]}" stroke-width="6" stroke-linecap="round" style="filter:drop-shadow(0 0 8px ${TEAM_COLORS[j % 8]})"/>`; } });
    svg.innerHTML = h;
  };
  const choose = (c, j, el) => {
    if (done.has(j)) return; sel = sel.filter(s => s.c !== c); sel.push({ c, j }); SFX.pop();
    if (sel.length === cols) { const ok = sel.every(s => s.j === sel[0].j); if (ok) { done.add(sel[0].j); SFX.ok(); if (done.size === groups.length) { SFX.fanfare(); confetti(2500); } } else { SFX.bad(); } sel = []; }

  ctx.btns([{ t: '👁 Nối hết', k: 'Enter', f: () => { groups.forEach((_, j) => done.add(j)); draw(); SFX.fanfare(); } }]);

/* ---- 32, 121, 110: sắp xếp thứ tự ---- */
function orderEngine(ctx, mode) {

      Object.values(byU).forEach(arr => { for (let k = 0; k + 1 < arr.length; k += 4) { const g = arr.slice(k, k + 4).sort((a, b) => a.a - b.a); if (g.length >= 2) rounds.push(g.map(x => x.q.replace(/\?$/, '') + ': ' + fmtNum(x.a) + ' ' + (x.u || ''))); } });

    let drag = -1;
    $$('[data-k]').forEach(el => {

      el.ondrop = e => { e.preventDefault(); if (drag < 0 || drag === k) return; const [x] = cur.splice(drag, 1); cur.splice(k, 0, x); checked = false; SFX.pop(); draw(); };

    return;
  }
  ctx.html(`<div class="center"><div style="font-size:14vh">${ctx.g.icon}</div><div class="big">${esc(ctx.g.name)}</div></div>`);
  ctx.btns([{ t: '▶ Vòng tiếp', k: 'ArrowRight', f: next, c: 'pri' }, { t: '✔ Kiểm tra', k: ' ', f: () => { checked = true; const ok = cur.every((t, k) => t === right[k]); ok ? (SFX.ok(), confetti(1500), ctx.stopTimer()) : SFX.bad(); draw(); } }, { t: '👁 Đáp án', k: 'Enter', f: () => { cur = right.slice(); checked = true; draw(); SFX.ok(); ctx.stopTimer(); } }]);

function bingoEngine(ctx, mode) {

}

function errorsEngine(ctx, fab) {
  const def = fab
    ? 'Chị ơi máy này có [B: màn hình 120Hz|F: màn hình 120Hz] nên lướt rất mượt. Pin 5000mAh [là lợi ích|là thông số – F] giúp chị dùng cả ngày. Camera chụp đêm giúp ảnh tối sáng rõ, [rất tốt luôn chị|giúp chị đi cà phê tối vẫn có ảnh đẹp đăng Facebook]. Sạc nhanh là [lợi ích B|ưu điểm A – nạp đầy nhanh hơn], còn lợi ích là [máy đẹp|sáng vội cắm 10 phút đủ dùng tới trưa].'
    : 'Dạ chào anh! Máy này có pin [500mAh|5000mAh] nên anh dùng thoải mái cả ngày. Màn hình [60Hz|120Hz] lướt cực mượt. Camera chính [5MP|50MP] chụp rất nét, và máy có kháng nước [IP86|IP68]. Bên cạnh đó máy sạc nhanh [8W|80W], [3 phút|30 phút] là gần đầy pin.';
  const text = ctx.cfgv('text', def);
  const parts = []; text.replace(/\[([^\]|]+)\|([^\]]+)\]|([^\[]+)/g, (m, w, r, t) => { if (t) t.split(/(\s+)/).forEach(x => x && parts.push({ t: x })); else parts.push({ t: w, fix: r, err: true }); return m; });
  const total = parts.filter(p => p.err).length; let found = 0;
  const draw = () => ctx.html(`<div class="center"><div class="mid">Có <span style="color:var(--acc)">${total}</span> lỗi – đội nào bắt đủ trước thắng! · Đã bắt: <span style="color:var(--ok)">${found}</span></div><div style="font-size:min(4.4vh,3vw);line-height:1.7;max-width:1400px;text-align:left;background:rgba(255,255,255,.05);padding:3vh 3vw;border-radius:22px">${parts.map((p, k) => /^\s+$/.test(p.t) ? p.t : `<span data-p="${k}" style="cursor:pointer;border-radius:8px;padding:0 .2vw;${p.show ? 'background:rgba(255,77,109,.25)' : ''}">${p.show ? `<s style="color:#ff8fa3">${esc(p.t)}</s> <b style="color:var(--ok)">${esc(p.fix)}</b>` : esc(p.t)}</span>`).join('')}</div><div class="sm2">Đội chỉ ra lỗi – trainer bấm vào chữ đó</div></div>`);
  draw();
  ctx.el.onclick = e => { const s = e.target.closest('[data-p]'); if (!s) return; const p = parts[+s.dataset.p]; if (p.err && !p.show) { p.show = true; found++; SFX.ok(); draw(); if (found === total) { SFX.fanfare(); confetti(2500); } } else if (!p.err) { SFX.bad(); s.classList.add('shake'); setTimeout(() => s.classList.remove('shake'), 500); } };
  ctx.timer(+ctx.cfgv('sec', 180), {});
  ctx.btns([{ t: '👁 Hiện hết lỗi', k: 'Enter', f: () => { parts.forEach(p => { if (p.err && !p.show) { p.show = true; found++; } }); draw(); } }]);
}

/* ---- 33, 40: hỏi dồn ---- */
function rapidEngine(ctx, mode) {
  const alive = ctx.guard();
  const Q = ctx.items.open(); let qi = 0, got = 0, run = false;
  if (mode === 'chorus') {
    const N = +ctx.cfgv('n', 10);
    const go = async () => {
      for (let k = 0; k < N; k++) {
        const q = Q[k % Q.length]; if (!alive() || !q) return;
        ctx.html(`<div class="center"><div class="sm2">${k + 1}/${N}</div><div class="big pop">${esc(q.q)}</div><div id="ca" class="big" style="color:var(--acc);min-height:12vh"></div></div>`); SFX.tick();
        ctx.timer(+ctx.cfgv('sec', 4), { silent: true, silentEnd: true }); await sleep(+ctx.cfgv('sec', 4) * 1000); if (!alive()) return;
        const a = $('#ca'); a.textContent = q.a; a.classList.add('pop'); SFX.ding(); await sleep(1600);
      }
      ctx.html('<div class="center"><div style="font-size:18vh">🔥</div><div class="big">Cả lớp quá đỉnh!</div></div>'); SFX.fanfare(); fireworks(3000);
    };
    ctx.html(`<div class="center"><div style="font-size:14vh">⏱️</div><div class="big">10 giây cuối</div><div class="sm2">Câu hỏi dồn dập – cả lớp HÔ ĐỒNG THANH đáp án trước khi màn hình hiện</div></div>`);
    ctx.btns([{ t: '▶ Bắt đầu', k: ' ', f: go, c: 'pri' }]);
    return;
  }
  let who = '';
  const card = () => { const q = Q[qi % Q.length]; ctx.html(`<div class="center"><div class="mid">🔥 Ghế nóng: <span style="color:var(--acc)">${esc(who)}</span> · đúng <b style="color:var(--ok)">${got}</b></div><div class="big pop">${esc(q.q)}</div><div id="ra" class="mid hidden" style="color:var(--acc)">${esc(q.a)}</div></div>`); };
  const start = async () => { who = await pickName('Ai ngồi ghế nóng?'); if (!alive()) return; got = 0; run = true; card(); ctx.timer(+ctx.cfgv('sec', 60), { onEnd: () => { run = false; ctx.html(`<div class="center"><div class="big">${esc(who)}: ${got} câu đúng!</div></div>`); SFX.fanfare(); confetti(2000); } }); };
  ctx.html(`<div class="center"><div style="font-size:14vh">🔥</div><div class="big">Ghế nóng</div><div class="sm2">1 người ngồi ghế nóng – cả lớp hỏi dồn trong 60 giây</div></div>`);
  ctx.btns([{ t: '🎯 Chọn người & bắt đầu', k: ' ', f: start, c: 'pri' }, { t: '✓ Đúng', k: 'y', f: () => { if (!run) return; got++; qi++; SFX.ok(); card(); } }, { t: '⏭ Bỏ qua', k: 'n', f: () => { if (!run) return; qi++; SFX.whoosh(); card(); } }, { t: '👁 Đáp án', k: 'Enter', f: () => { const a = $('#ra'); if (a) a.classList.remove('hidden'); } }]);
}

/* ---- 36: bom nổ chậm ---- */
function bombPassEngine(ctx) {
  const alive = ctx.guard(); const Q = ctx.items.open(); let qi = 0;
  const round = () => {
    ctx.clearTimers(); const t = rint(+ctx.cfgv('min', 12), +ctx.cfgv('max', 40)) * 1000, t0 = performance.now(); let last = 0;
    ctx.html(`<div class="center"><div id="bb" style="font-size:30vh;transition:transform .1s">💣</div><div class="big">Chuyền bom đi!</div><div class="sm2">Bom có thể nổ bất cứ lúc nào…</div></div>`);
    ctx.loop(() => {
      if (!alive()) return false; const e = performance.now() - t0, k = e / t, gap = Math.max(90, 650 * (1 - k));
      if (e - last > gap) { last = e; SFX.tick(); const b = $('#bb'); if (b) { b.style.transform = `scale(${1 + .12 * k}) rotate(${rnd(-8, 8) * k}deg)`; } }
      if (e >= t) { SFX.boom(); ctx.flash('#ff8a3d'); const q = Q[qi++ % Math.max(1, Q.length)]; ctx.html(`<div class="center"><div style="font-size:18vh" class="pop">💥</div><div class="mid">Ai đang cầm bom – trả lời!</div><div class="big">${esc(q ? q.q : '')}</div><div id="ba" class="big hidden" style="color:var(--acc)">${esc(q ? q.a : '')}</div></div>`); ctx.timer(+ctx.cfgv('sec', 15), {}); return false; }
    });
  };
  ctx.html(`<div class="center"><div style="font-size:16vh">💣</div><div class="big">Bom nổ chậm</div><div class="sm2">Chuyền 1 món đồ làm “quả bom” quanh lớp. Bom nổ trong tay ai – người đó trả lời!</div></div>`);
  ctx.btns([{ t: '▶ Châm ngòi', k: ' ', f: round, c: 'pri' }, { t: '👁 Đáp án', k: 'Enter', f: () => { const a = $('#ba'); if (a) { a.classList.remove('hidden'); SFX.ok(); ctx.stopTimer(); } } }]);
}

/* ---- 10, 39, 45: bình chọn ---- */
function pollEngine(ctx, mode) {

  const cnt = opts.map(() => 0); const key = 'poll_' + norm(S.cls.name || 'lop') + '_' + ctx.g.no;
  let real = null, phone = false;
  const draw = () => {
    const mx = Math.max(1, ...cnt), tot = cnt.reduce((a, b) => a + b, 0);
    ctx.html(`<div class="center"><div class="mid">${esc(ctx.cfgv('q', mode === 'poll' ? 'Theo bạn, khách quan tâm điều gì nhất?' : 'Bình chọn: ai xuất sắc nhất?'))}</div><div style="width:min(1400px,92vw);display:flex;flex-direction:column;gap:1.2vh">${opts.map((o, k) => `<div style="display:flex;align-items:center;gap:1vw"><div style="width:22vw;text-align:right;font-weight:800;font-size:2.6vh">${esc(o)}</div><div style="flex:1;height:6vh;background:rgba(255,255,255,.06);border-radius:12px;overflow:hidden;position:relative"><div style="height:100%;width:${cnt[k] / mx * 100}%;background:${TEAM_COLORS[k % 8]};transition:width .5s;border-radius:12px"></div>${real ? `<div style="position:absolute;top:0;bottom:0;left:${(real[k] || 0)}%;border-left:4px dashed #fff"></div>` : ''}</div><div style="width:9vw;font-weight:900;font-size:3vh">${cnt[k]}${tot ? ` <small style="color:var(--mut);font-size:1.8vh">${Math.round(cnt[k] / tot * 100)}%</small>` : ''}</div><button class="btn sm" data-m="${k}">−</button><button class="btn sm" data-p="${k}">+</button></div>`).join('')}</div>${real ? '<div class="sm2">Vạch trắng = số liệu thật (%)</div>' : ''}</div>`);
    ctx.el.onclick = e => { const p = e.target.closest('[data-p]'), m = e.target.closest('[data-m]'); if (p) { cnt[+p.dataset.p]++; SFX.pop(); draw(); } if (m) { cnt[+m.dataset.m] = Math.max(0, cnt[+m.dataset.m] - 1); draw(); } };
  };
  draw();
  const b = [];
  if (ctx.room) b.push({ t: '📱 Mở bình chọn trên điện thoại', c: 'pri', f: async () => { phone = true; roomSend({ kind: 'choice', q: ctx.cfgv('q', 'Bình chọn'), opts, qid: 'v' + Date.now().toString(36), open: true }); SFX.ding(); const tick = ctx.every(2500, async () => { const r = await roomCollect(true); if (!r) return; opts.forEach((_, k) => cnt[k] = 0); Object.values(r.answers).forEach(a => { if (cnt[+a.a] != null) cnt[+a.a]++; }); draw(); }); } });
  b.push({ t: '🥁 Công bố', k: 'Enter', c: 'acc', f: () => { SFX.drum(1.5); ctx.after(1600, () => { const mx = Math.max(...cnt); const w = opts.filter((_, k) => cnt[k] === mx); ctx.html(`<div class="center"><div style="font-size:16vh">🏆</div><div class="big pop" style="color:var(--acc)">${w.map(esc).join(' & ')}</div><div class="mid">${mx} phiếu</div></div>`); SFX.fanfare(); fireworks(3000); if (mode === 'teams') w.forEach(n => { const i = S.cls.teams.findIndex(t => t.name === n); if (i >= 0) addScore(i, 3); }); if (phone) roomSend({ kind: 'wait', msg: 'Đã chốt bình chọn!' }); }); } });
  if (mode === 'poll') { b.push({ t: '💾 Lưu dự đoán', f: () => { saveData(key, { at: Date.now(), opts, cnt }); toast('Đã lưu – cuối buổi mở lại để so sánh.'); } }); b.push({ t: '📂 Mở lại đầu buổi', f: () => { const d = S.data[key]; if (!d) return toast('Chưa lưu dự đoán nào cho lớp này.', true); d.cnt.forEach((v, k) => cnt[k] = v); draw(); } }); b.push({ t: '📊 Nhập số liệu thật', f: () => { const m = modal({ title: 'Số liệu thật (%)', parent: $('#stage'), body: opts.map((o, k) => `<label class="f"><span>${esc(o)}</span><input class="inp" type="number" data-r="${k}" value="${real ? real[k] : ''}"></label>`).join(''), foot: '<button class="btn pri" id="rOk">So sánh</button>' }); $('#rOk', m.el).onclick = () => { real = $$('[data-r]', m.el).map(i => +i.value || 0); m.close(); draw(); SFX.ding(); }; } }); }
  ctx.btns(b);
}

/* ---- 14, 47, 35, 38, 44, 50: thu thập ý kiến (đám mây chữ, vé ra cửa, cam kết, thư 30 ngày) ---- */
function collectEngine(ctx, mode) {
  const key = 'cloud_' + norm(S.cls.name || 'lop');
  const items = []; let phone = false;
  const cols = mode === '321' ? ['3 điều nhớ', '2 điều thích', '1 câu thắc mắc'] : null;
  const draw = () => {
    if (mode === 'cloud' || mode === 'cloud2') {
      const freq = {}; items.forEach(x => { const k = norm(x.t); if (!k) return; freq[k] = freq[k] || { t: x.t, n: 0 }; freq[k].n++; });
      const arr = Object.values(freq).sort((a, b) => b.n - a.n), mx = Math.max(1, ...arr.map(a => a.n));
      const cloud = (list, title) => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:1vh"><div class="sm2">${title}</div><div style="display:flex;flex-wrap:wrap;gap:.6vh 1.6vw;justify-content:center;align-items:center;max-width:${mode === 'cloud2' ? 46 : 92}vw">${shuffle(list).map((a, k) => `<span class="pop" style="font-weight:900;font-size:${2.4 + a.n / mx * 7}vh;color:${TEAM_COLORS[k % 8]};animation-delay:${k * .03}s">${esc(a.t)}</span>`).join('')}</div></div>`;
      const old = S.data[key];
      ctx.html(`<div style="display:flex;gap:2vw;width:100%;height:100%;padding:3vh 2vw;align-items:center">${mode === 'cloud2' && old ? cloud(old.list || [], '☀️ Đầu buổi') : ''}${cloud(arr, mode === 'cloud2' ? '🌙 Cuối buổi' : 'Mỗi người 1 từ')}</div>`);
      return;
    }
    if (cols) { ctx.html(`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1.4vw;width:100%;height:100%;padding:2vh 2vw">${cols.map((c, k) => `<div class="card" style="overflow:auto"><div class="mid" style="color:${TEAM_COLORS[k]}">${c}</div>${items.filter(x => x.col === k).map(x => `<div class="chip pop" style="display:block;margin:.6vh 0;font-size:2.2vh;text-align:left">${esc(x.t)}</div>`).join('')}</div>`).join('')}</div>`); return; }
    ctx.html(`<div style="display:flex;flex-wrap:wrap;gap:1.2vh 1vw;align-content:flex-start;width:100%;height:100%;padding:2vh 2vw;overflow:auto">${items.map((x, k) => `<div class="pop" style="width:min(22vw,340px);min-height:14vh;padding:1.4vh 1vw;border-radius:6px;background:${['#fff59d', '#ffccbc', '#c8e6c9', '#bbdefb', '#e1bee7'][k % 5]};color:#222;font-weight:700;font-size:2.1vh;box-shadow:0 6px 12px rgba(0,0,0,.3);transform:rotate(${rnd(-3, 3)}deg)">${x.who ? `<div style="font-size:1.6vh;opacity:.6">${esc(x.who)}</div>` : ''}${esc(x.t)}</div>`).join('')}${!items.length ? `<div class="center"><div style="font-size:14vh">${ctx.g.icon}</div><div class="mid">${esc(ctx.g.how)}</div></div>` : ''}</div>`);
  };
  const add = (t, who, col) => { t = String(t || '').trim(); if (!t) return; items.push({ t, who, col: col || 0 }); SFX.pop(); draw(); };
  draw();
  const typeBox = () => {
    const m = modal({ title: 'Gõ nhanh ý kiến', parent: $('#stage'), body: `${mode === 'letter' || mode === 'ticket' || mode === 'commit' ? '<label class="f"><span>Tên (không bắt buộc)</span><input class="inp" id="cW"></label>' : ''}${cols ? `<label class="f"><span>Cột</span><select class="inp" id="cC">${cols.map((c, k) => `<option value="${k}">${c}</option>`).join('')}</select></label>` : ''}<label class="f"><span>Nội dung – Enter để thêm</span><textarea class="inp" id="cT" style="min-height:70px"></textarea></label>`, foot: '<button class="btn pri" id="cAdd">Thêm (Enter)</button>' });
    const go = () => { add($('#cT', m.el).value, $('#cW', m.el) && $('#cW', m.el).value, $('#cC', m.el) && +$('#cC', m.el).value); $('#cT', m.el).value = ''; $('#cT', m.el).focus(); };
    $('#cAdd', m.el).onclick = go; $('#cT', m.el).onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); } }; $('#cT', m.el).focus();
  };
  const b = [{ t: '⌨️ Gõ ý kiến', k: 'Enter', f: typeBox, c: 'pri' }];
  if (ctx.room) b.push({ t: '📱 Nhận từ điện thoại', f: () => { phone = true; const qid = 'c' + Date.now().toString(36); roomSend({ kind: 'text', q: ctx.cfgv('q', { cloud: 'Gõ 1 từ khi nghĩ về sản phẩm mới', cloud2: '1 từ cảm nhận sau buổi học', ticket: '1 điều học được + 1 việc sẽ làm ngày mai', '321': '3 điều nhớ – 2 điều thích – 1 thắc mắc', commit: 'Mục tiêu bán tuần tới của bạn', letter: 'Thư gửi chính mình 30 ngày sau' }[mode] || 'Ý kiến của bạn'), qid, open: true, multi: mode === '321' }); const seen = new Set(); ctx.every(3000, async () => { const r = await roomCollect(true); if (!r) return; Object.entries(r.answers).forEach(([pid, a]) => { const k = pid + '|' + a.a; if (seen.has(k)) return; seen.add(k); const p = r.players.find(x => x.id === pid); add(a.a, p ? p.name : ''); }); }); SFX.ding(); } });
  if (mode === 'cloud') b.push({ t: '💾 Lưu đám mây (để so cuối buổi)', f: () => { const freq = {}; items.forEach(x => { const k = norm(x.t); freq[k] = freq[k] || { t: x.t, n: 0 }; freq[k].n++; }); saveData(key, { at: Date.now(), list: Object.values(freq) }); toast('Đã lưu. Cuối buổi chơi game 47 “Một từ kết thúc” để so sánh.'); } });
  if (mode === 'commit') b.push({ t: '📸 Đếm ngược chụp ảnh', f: async () => { const o = document.createElement('div'); o.className = 'ovl'; ctx.el.appendChild(o); for (const n of ['3', '2', '1', '📸 CƯỜI!']) { o.innerHTML = `<div style="font-size:30vh;font-weight:900" class="pop">${n}</div>`; SFX.tick(); await sleep(900); } SFX.shutter(); ctx.flash('#fff'); setTimeout(() => o.remove(), 600); confetti(2500); } });
  if (mode === 'letter') b.push({ t: '💌 Gửi vào hộp thư 30 ngày', c: 'acc', f: async () => { if (!items.length) return toast('Chưa có thư nào.', true); try { const r = await call('gameLettersSave', { cls: S.cls.name, days: +ctx.cfgv('days', 30), letters: items.map(x => ({ who: x.who, text: x.t })) }); toast(`Đã cất ${r.saved} lá thư – ngày ${r.due} bot DingTalk sẽ nhắn bạn gửi lại cho lớp.`); SFX.fanfare(); } catch (e) { toast(esc(e.message), true); } } });
  ctx.btns(b);
}

/* ---- 114: thẻ bay vòng quanh tên rồi dừng ---- */
function orbitPick(ctx) {
  const names = (S.cls.roster || []).filter(Boolean).slice(0, 40);
  const list = names.length ? names : S.cls.teams.map(t => t.name);
  return new Promise(res => {
    const alive = ctx.guard();
    const ov = document.createElement('div'); ov.className = 'ovl'; ov.style.background = 'rgba(6,9,20,.95)'; ctx.el.appendChild(ov);
    ov.innerHTML = (`<div style="position:relative;width:100%;height:100%" id="ob">${list.map((n, k) => { const a = k / list.length * Math.PI * 2; return `<div class="chip" data-n="${k}" style="position:absolute;left:${50 + 40 * Math.cos(a)}%;top:${50 + 38 * Math.sin(a)}%;transform:translate(-50%,-50%);font-size:${list.length > 24 ? 1.6 : 2.2}vh;transition:.2s">${esc(n)}</div>`; }).join('')}<div id="card" style="position:absolute;left:50%;top:50%;width:12vh;height:16vh;margin:-8vh 0 0 -6vh;border-radius:14px;background:linear-gradient(145deg,#ffcf33,#ff8a3d);display:flex;align-items:center;justify-content:center;font-size:7vh;box-shadow:0 10px 30px rgba(0,0,0,.5)">❓</div></div>`);
    const card = $('#card'); const stopAt = rint(0, list.length - 1), total = list.length * rint(2, 3) + stopAt; let k = 0;
    const step = () => {
      if (!alive()) return; const idx = k % list.length, a = idx / list.length * Math.PI * 2;
      card.style.transition = 'left .12s,top .12s'; card.style.left = (50 + 30 * Math.cos(a)) + '%'; card.style.top = (50 + 28 * Math.sin(a)) + '%';
      $$('[data-n]').forEach(el => { el.style.background = +el.dataset.n === idx ? 'var(--acc)' : ''; el.style.color = +el.dataset.n === idx ? '#241a00' : ''; });
      SFX.tick(); k++;
      if (k > total) { SFX.ding(); confetti(1200); setTimeout(() => { ov.remove(); res(list[idx]); }, 1100); return; }
      setTimeout(step, 60 + Math.pow(k / total, 3) * 420);
    };
    step();
  });
}
