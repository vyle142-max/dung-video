/* ===== 60_bank.js ===== */
/* =========================================================
   NGÂN HÀNG CÂU HỎI – 4 cách nhập
   1) Tự nhập  2) Gửi file có sẵn đáp án (Excel/Word/PDF/ảnh)  3) Gửi tài liệu → AI soạn  4) AI soạn theo chủ đề
   Mọi cách đều qua bảng xem trước: câu thiếu đáp án tô vàng, trainer sửa rồi mới lưu.
   ========================================================= */
const TYPES = { mc: 'Nhiều lựa chọn', tf: 'Đúng / Sai', open: 'Trả lời ngắn', num: 'Con số', fab: 'FAB' };
function loadScript(src) { return new Promise((res, rej) => { if ($(`script[src="${src}"]`)) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Không tải được thư viện đọc file – kiểm tra mạng.')); document.head.appendChild(s); }); }
const LIB = {
  xlsx: 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
  mammoth: 'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js',
  pdf: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',
  pdfw: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'
};
function itemMissing(x) {
  if (x.t === 'mc') return !x.q || !x.o || x.o.filter(Boolean).length < 2 || !(x.a >= 0 && x.a < x.o.length) || !x.o[x.a];
  if (x.t === 'tf') return !x.q || typeof x.a !== 'boolean';
  if (x.t === 'num') return !x.q || !Number.isFinite(Number(x.a)) || x.a === '' || x.a == null;
  if (x.t === 'fab') return !x.f || !x.a || !x.b;
  return !x.q || !String(x.a || '').trim();
}
function cleanItem(x) {
  const o = { t: TYPES[x.t] ? x.t : 'open' };
  if (o.t === 'fab') { o.f = String(x.f || x.q || '').trim(); o.a = String(x.a || '').trim(); o.b = String(x.b || '').trim(); if (x.n) o.n = String(x.n).trim(); }
  else {
    o.q = String(x.q || '').trim();
    if (o.t === 'mc') { o.o = (x.o || []).map(s => String(s == null ? '' : s).trim()).filter((s, i, arr) => s || i < 2); o.a = x.a == null || x.a === '' ? -1 : Number(x.a); }
    else if (o.t === 'tf') o.a = typeof x.a === 'boolean' ? x.a : /^(đ|d|true|1|yes|y)/i.test(norm(x.a)) ? true : /^(s|false|0|no|n)/i.test(norm(x.a)) ? false : null;
    else if (o.t === 'num') { o.a = x.a === '' || x.a == null ? null : Number(String(x.a).replace(/[^\d.,-]/g, '').replace(/\.(?=\d{3}\b)/g, '').replace(',', '.')); if (x.u) o.u = String(x.u).trim(); }
    else o.a = x.a == null ? '' : String(x.a).trim();
  }
  if (x.e) o.e = String(x.e).trim(); if (x.tag) o.tag = String(x.tag).trim();
  return o;
}

/* ---------- đọc văn bản dạng “Câu 1… A. … B. … Đáp án: B” ---------- */
function parseText(txt) {
  const L = String(txt || '').replace(/\r/g, '').split('\n').map(s => s.replace(/ /g, ' ').trim());
  const out = []; let cur = null;
  const push = () => { if (cur && (cur.q || cur.o.length)) out.push(cur); cur = null; };
  const qRe = /^(?:câu|cau|question|q)\s*(\d+)\s*[:.)\-–]?\s*(.*)$/i, qRe2 = /^(\d{1,3})\s*[.)]\s+(.*)$/, oRe = /^\*?\s*([A-Fa-f])\s*[.)\/:\-–]\s*(.+)$/, aRe = /^(?:đáp án|dap an|đ\/?a|answer|ans|đáp án đúng)\s*[:.\-–]?\s*(.*)$/i, eRe = /^(?:giải thích|giai thich|explanation|lý do)\s*[:.\-–]?\s*(.*)$/i;
  L.forEach(line => {
    if (!line) return;
    let m;
    if ((m = line.match(qRe)) || (m = line.match(qRe2))) { push(); cur = { q: m[2] || '', o: [], a: null, e: '' }; return; }
    if (!cur) { cur = { q: line, o: [], a: null, e: '' }; return; }
    if ((m = line.match(oRe))) { let t = m[2].trim(); let star = /^\*/.test(line) || /\(\s*(đúng|x|✓|correct)\s*\)\s*$/i.test(t) || /\*$/.test(t); t = t.replace(/\s*\(\s*(đúng|x|✓|correct)\s*\)\s*$/i, '').replace(/\*$/, '').trim(); cur.o.push(t); if (star) cur.a = cur.o.length - 1; return; }
    if ((m = line.match(aRe))) { cur.ans = m[1].trim(); return; }
    if ((m = line.match(eRe))) { cur.e = m[1].trim(); return; }
    if (cur.o.length === 0 && !cur.ans) cur.q = (cur.q ? cur.q + ' ' : '') + line; else if (cur.e) cur.e += ' ' + line;
  });
  push();
  return out.map(c => {
    const ans = c.ans == null ? '' : c.ans;
    if (c.o.length >= 2) {
      const allTF = c.o.length === 2 && c.o.every(x => /^(đúng|sai|true|false)$/i.test(norm(x).replace('dung', 'đúng')) || /^(dung|sai)$/.test(norm(x)));
      let a = c.a; if (a == null && ans) { const lm = ans.match(/^([A-Fa-f])\b/); if (lm) a = 'abcdef'.indexOf(lm[1].toLowerCase()); else { const k = c.o.findIndex(o => norm(o) === norm(ans)); if (k >= 0) a = k; } }
      if (allTF) return cleanItem({ t: 'tf', q: c.q, a: a == null ? '' : norm(c.o[a]).startsWith('d') || norm(c.o[a]).startsWith('t'), e: c.e });
      return cleanItem({ t: 'mc', q: c.q, o: c.o, a: a == null ? -1 : a, e: c.e });
    }

/* ---------- đọc bảng Excel / CSV đúng mẫu ---------- */
function parseRows(rows) {
  if (!rows || rows.length < 2) return [];
  const H = rows[0].map(h => norm(h));
  const col = (...names) => H.findIndex(h => names.some(n => h === n || h.indexOf(n) === 0));
  const cQ = col('cau hoi', 'question', 'noi dung', 'cau'), cT = col('loai', 'dang', 'type'), cA = col('dap an', 'answer', 'dap an dung'), cE = col('giai thich', 'explanation', 'ghi chu'), cTag = col('chu de', 'tag', 'topic'), cU = col('don vi', 'unit');
  const cF = col('f', 'tinh nang', 'feature'), cAd = H.findIndex(h => h === 'a (uu diem)' || h === 'uu diem' || h === 'advantage'), cB = col('b', 'loi ich', 'benefit');
  const opt = ['a', 'b', 'c', 'd', 'e', 'f'].map(l => H.findIndex(h => h === l || h === 'dap an ' + l || h === 'lua chon ' + l || h === 'phuong an ' + l));
  if (cQ < 0 && cF < 0) return null;
  const out = [];
  rows.slice(1).forEach(r => {
    const g = i => i >= 0 && r[i] != null ? String(r[i]).trim() : '';
    if (!r.some(v => String(v == null ? '' : v).trim())) return;
    const t = norm(g(cT));
    if (/fab/.test(t) || (cF >= 0 && g(cF) && !g(cQ))) { out.push(cleanItem({ t: 'fab', f: g(cF) || g(cQ), a: g(cAd), b: g(cB), tag: g(cTag) })); return; }
    const os = opt.map(g).filter((v, i) => opt[i] >= 0);
    const ans = g(cA);
    if (/dung|sai|tf/.test(t) || (!os.filter(Boolean).length && /^(đúng|sai|dung|true|false)$/i.test(norm(ans)))) { out.push(cleanItem({ t: 'tf', q: g(cQ), a: ans, e: g(cE), tag: g(cTag) })); return; }
    if (os.filter(Boolean).length >= 2) { let a = -1; const lm = ans.match(/^([A-Fa-f])\b/); if (lm) a = 'abcdef'.indexOf(lm[1].toLowerCase()); else a = os.findIndex(o => o && norm(o) === norm(ans)); out.push(cleanItem({ t: 'mc', q: g(cQ), o: os.filter(Boolean), a, e: g(cE), tag: g(cTag) })); return; }
    if (/so|num/.test(t) || (/^-?[\d.,]+$/.test(ans) && ans)) { out.push(cleanItem({ t: 'num', q: g(cQ), a: ans, u: g(cU), e: g(cE), tag: g(cTag) })); return; }
    out.push(cleanItem({ t: 'open', q: g(cQ), a: ans, e: g(cE), tag: g(cTag) }));
  });
  return out;
}

function editSet(set, how) {

  };

      ${miss ? `<div class="card" style="background:rgba(255,207,51,.12);border-color:rgba(255,207,51,.6);margin-bottom:10px">⚠️ <b>${miss} câu</b> thiếu đáp án hoặc nội dung (tô vàng) – bổ sung trước khi lưu, hoặc xoá đi. <button class="btn sm" id="edOnlyMiss">Chỉ xem câu thiếu</button></div>` : ''}

    if (miss && !(await ask('Còn câu thiếu đáp án', `${miss} câu còn thiếu đáp án – những câu này sẽ <b>không</b> được dùng trong game cho tới khi bạn bổ sung. Vẫn lưu?`, 'Vẫn lưu'))) return;

    catch (e) { toast(esc(e.message), true); b.disabled = false; b.textContent = '💾 Lưu bộ câu hỏi'; }

}
/** Sau khi lưu: gợi ý đưa bộ câu hỏi vào game phù hợp */
function afterSave(id) {
  const b = S.bank.find(x => x.id === id); if (!b) return;
  const has = t => (b.items || []).some(x => x.t === t && !itemMissing(x));
  const fit = GAMES.filter(g => g.bank && (has('fab') ? true : g.g !== 'D') && (has('num') || ![5, 85, 121].includes(g.no))).slice(0, 125);
  const pickList = [106, 107, 115, 18, 19, 20, 49, 120, 116, 83, 71, 72].map(n => GAMES.find(g => g.no === n)).filter(g => fit.indexOf(g) >= 0);
  if (has('fab')) [51, 55, 68, 70].forEach(n => pickList.push(GAMES.find(g => g.no === n)));
  const m = modal({ title: '🎮 Đưa bộ “' + esc(b.name) + '” vào game nào?', body: `<p class="sub">Bộ câu hỏi dùng được cho mọi game có biểu tượng 📚. Gợi ý nhanh:</p><div class="grid">${pickList.map(g => `<div class="gc grp${g.g}" data-g="${g.no}" style="min-height:0"><span class="no">${g.g}${g.no}</span><div class="ic">${g.icon}</div><h3>${esc(g.name)}</h3></div>`).join('')}</div>` });
  $$('[data-g]', m.el).forEach(el => el.onclick = () => { m.close(); const g = GAMES.find(x => x.no === +el.dataset.g); const cfg = gameCfg(g); cfg.sets = [id]; saveGameCfg(g, cfg); openGame(g); });
}

/* ===== 70_room.js ===== */
/* =========================================================
   ĐỢT 2 – HỌC VIÊN QUÉT QR, CHƠI BẰNG ĐIỆN THOẠI
   Máy trainer tạo phòng → học viên quét QR, nhập tên, chọn đội → trả lời trên điện thoại.
   Trạng thái phòng giữ 6 giờ trong bộ nhớ đệm của web nhân sự, không ghi vào sheet.
   ========================================================= */
const QR_LIB = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
function roomLink() { return location.origin + location.pathname + '#r=' + S.room.code + '&api=' + encodeURIComponent(S.api); }
async function roomOpen() {
  if (S.room && S.room.code) return roomShow();
  try {
    const r = await call('roomCreate', { title: S.cls.name || 'Lớp học', teams: S.cls.teams.map(t => t.name) });
    S.room = { code: r.code, qid: '', players: [], scores: {}, answered: {} };
    roomBadge(); roomShow(); SFX.ding();
  } catch (e) { toast(esc(e.message), true); }
}
async function roomShow() {
  const host = $('#stage') || document.body;
  const m = modal({ title: '📱 Học viên quét mã để vào chơi', parent: host, wide: true, body: `<div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap;justify-content:center"><div id="qrB" style="background:#fff;padding:14px;border-radius:16px;min-width:300px;min-height:300px;display:flex;align-items:center;justify-content:center;color:#000">Đang tạo mã QR…</div>
    <div style="flex:1;min-width:260px"><div class="sub">Mã phòng</div><div style="font-size:64px;font-weight:900;letter-spacing:6px;color:var(--acc)">${S.room.code}</div><p class="sub">Hoặc mở link trên điện thoại:<br><span style="word-break:break-all;font-size:12px">${esc(roomLink())}</span></p><div class="mid" style="text-align:left;font-size:22px">👥 <span id="rpN">${S.room.players.length}</span> người đã vào</div><div id="rpL" class="sub" style="max-height:180px;overflow:auto"></div></div></div>`,
    foot: '<button class="btn bad" id="rpClose">Đóng phòng</button><span class="grow"></span><button class="btn pri" data-x>Xong – vào chơi</button>' });
  try { await loadScript(QR_LIB); const q = window.qrcode(0, 'M'); q.addData(roomLink()); q.make(); $('#qrB', m.el).innerHTML = q.createSvgTag({ cellSize: 7, margin: 2 }); }
  catch (e) { $('#qrB', m.el).innerHTML = '<div style="padding:20px;text-align:center">Không tạo được mã QR (mất mạng?)<br>Học viên nhập link bên cạnh.</div>'; }
  const upd = async () => { if (!document.body.contains(m.el)) return; const r = await roomCollect(true); if (r) { $('#rpN', m.el).textContent = r.players.length; $('#rpL', m.el).innerHTML = r.players.map(p => esc(p.name) + (p.team ? ' <span class="pill">' + esc(p.team) + '</span>' : '')).join(' · '); } setTimeout(upd, 3000); };
  upd();
  $('#rpClose', m.el).onclick = async () => { try { await call('roomClose', { code: S.room.code }); } catch (e) {} S.room = null; m.close(); roomBadge(); toast('Đã đóng phòng.'); };
}
function roomBadge() {
  const el = $('#sRoom'); if (!el) return;
  el.innerHTML = S.room && S.room.code ? `<button class="btn sm pri" id="rB">📱 ${S.room.code} · ${S.room.players.length} người</button>` : `<button class="btn sm" id="rB" title="Học viên quét QR chơi bằng điện thoại">📱 Mở phòng</button>`;
  $('#rB').onclick = roomOpen;
}
async function roomSend(st) {
  if (!S.room || !S.room.code) return;
  if (st.qid) S.room.qid = st.qid; S.room.st = st;
  try { await call('roomPush', { code: S.room.code, st }); } catch (e) { toast('📱 ' + esc(e.message), true); }
}
async function roomCollect(silent) {
  if (!S.room || !S.room.code) return null;
  try { const r = await call('roomPull', { code: S.room.code, qid: S.room.qid }); S.room.players = r.players || []; roomBadge(); return r; }
  catch (e) { if (!silent) toast('📱 ' + esc(e.message), true); return null; }
}
/** Chấm điểm câu vừa xong: cá nhân theo tốc độ, đội +1 cho mỗi thành viên đúng */
function roomScore(res, good) {
  if (!res) return; const R = S.room, fast = [];
  Object.entries(res.answers).forEach(([pid, a]) => {
    if (!good(a.a)) return; const p = res.players.find(x => x.id === pid); if (!p) return;
    const pts = Math.max(300, Math.round(1000 - (a.t || 0) / 40)); R.scores[pid] = (R.scores[pid] || 0) + pts; fast.push({ name: p.name, t: a.t || 0 });
    const ti = S.cls.teams.findIndex(t => norm(t.name) === norm(p.team)); if (ti >= 0) addScore(ti, 1, true);
  });
  fast.sort((a, b) => a.t - b.t);
  const n = Object.keys(res.answers).length, ok = fast.length;
  const host = $('#stage .main'); if (host) { const d = document.createElement('div'); d.className = 'chip pop'; d.style.cssText = 'position:absolute;left:2vw;bottom:2vh;z-index:6;font-size:2.2vh;max-width:60vw'; d.innerHTML = `📱 ${ok}/${n} đúng${fast.length ? ' · ⚡ nhanh nhất: ' + fast.slice(0, 3).map(f => esc(f.name) + ' (' + (f.t / 1000).toFixed(1) + 's)').join(', ') : ''}`; host.appendChild(d); }
  teamBar();
}
function roomDone() {
  if (!S.room) return; const top = Object.entries(S.room.scores).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([pid, s]) => ({ name: (S.room.players.find(p => p.id === pid) || {}).name || '?', s }));
  roomSend({ kind: 'leader', top });
}
function roomIdle() { roomSend({ kind: 'wait', msg: 'Chờ trainer mở game tiếp theo…' }); }

/* ---------- màn hình điện thoại của học viên ---------- */
async function phoneApp(code, api) {

  const app = $('#app');
  const pc = (action, payload) => call(action, Object.assign({ code }, payload), { real: !S.dev, api });
  const join = async () => {
    try { const s = await pc('roomState', { v: -1 }); P.teams = s.teams || []; } catch (e) { app.innerHTML = `<div class="ph"><h2>😕 ${esc(e.message)}</h2></div>`; return; }
    app.innerHTML = `<div class="ph"><h2 style="margin:6px 0">🎮 Vào phòng ${esc(code)}</h2><label class="f"><span>Tên của bạn</span><input class="inp" id="pN" value="${esc(P.name)}" maxlength="40" style="font-size:20px"></label>${P.teams.length ? `<label class="f"><span>Đội của bạn</span><select class="inp" id="pT" style="font-size:20px">${P.teams.map(t => `<option>${esc(t)}</option>`).join('')}</select></label>` : ''}<button class="btn pri lg" id="pGo" style="justify-content:center">Vào chơi</button></div>`;
    $('#pGo').onclick = async () => {
      const name = $('#pN').value.trim(); if (!name) return toast('Nhập tên nhé!', true);
      $('#pGo').disabled = true;
      try { const r = await pc('roomJoin', { name, team: $('#pT') ? $('#pT').value : '', pid: P.pid }); P.pid = r.pid; P.name = r.name; P.team = r.team; store('gm_pid_' + code, r.pid); store('gm_pname', r.name); loop(); }
      catch (e) { toast(esc(e.message), true); $('#pGo').disabled = false; }

  };
  const render = () => {

    if (st.kind === 'choice') h = `<h2 style="margin:4px 0">${esc(st.q || '')}</h2>${(st.opts || []).map((o, i) => `<button class="pbtn c${i % 6} ${mine && +mine.a === i ? 'sel' : ''}" data-a="${i}" ${mine || !st.open ? 'disabled' : ''}>${OPT_KEYS[i]}. ${esc(o)}</button>`).join('')}${mine ? '<p class="sub">✅ Đã gửi – chờ đáp án…</p>' : !st.open ? '<p class="sub">⏱ Đã hết giờ</p>' : ''}`;
    else if (st.kind === 'text' || st.kind === 'number') h = `<h2 style="margin:4px 0">${esc(st.q || '')}</h2>${mine && !st.multi ? `<p class="mid">✅ Đã gửi: ${esc(mine.a)}</p>` : `<${st.kind === 'number' ? 'input type="number" inputmode="decimal"' : 'textarea'} class="inp" id="pA" style="font-size:20px;min-height:${st.kind === 'number' ? 0 : 120}px">${st.kind === 'number' ? '' : '</textarea>'}<button class="btn pri lg" id="pS" style="justify-content:center">Gửi</button>${mine ? '<p class="sub">✅ Đã gửi – có thể gửi thêm</p>' : ''}`}`;
    else if (st.kind === 'buzz') h = `<button class="pbtn c0" id="pB" style="height:50vh;font-size:40px;text-align:center" ${mine ? 'disabled' : ''}>🔔 BẤM!</button>`;
    else if (st.kind === 'result') h = `<div style="font-size:90px;text-align:center">${mine ? (P.lastOk ? '🎉' : '🤔') : '⏳'}</div><h2 style="text-align:center">Đáp án: ${esc(st.right)}</h2>${mine ? `<p class="sub" style="text-align:center">Bạn chọn: ${esc(P.lastText || mine.a)} ${P.lastOk ? '– chính xác!' : ''}</p>` : ''}`;

    else h = `<div style="font-size:90px;text-align:center;margin-top:10vh">⏳</div><h2 style="text-align:center">${esc(st.msg || 'Nhìn lên màn hình nhé – chờ trainer…')}</h2>`;

    } catch (e) { if (/không tìm thấy phòng/i.test(e.message)) { app.innerHTML = `<div class="ph"><h2>Phòng đã đóng. Cảm ơn bạn đã chơi! 👋</h2></div>`; return; } }
    setTimeout(loop, 1800 + Math.random() * 900);
  };
  if (P.pid) { try { await pc('roomJoin', { name: P.name || 'Học viên', pid: P.pid }); loop(); return; } catch (e) {} }
  join();
}

function openPrizes() {
  let P = (S.data.prizes || []).map(p => Object.assign({}, p));

  if (!P.length) P = [{ name: 'Voucher 50k', qty: 3 }, { name: 'Ly giữ nhiệt', qty: 2 }, { name: 'Về sớm 5 phút', qty: 5 }, { name: 'Tràng pháo tay', qty: 99 }];

  $('#pzFill', m.el).onclick = () => { sync(); P.forEach(p => p.left = p.qty); draw(); };
  $('#pzTry', m.el).onclick = () => { sync(); const keep = S.data.prizes; S.data.prizes = P.filter(p => p.name); spinWheel(S.data.prizes.filter(p => (p.left == null ? p.qty : p.left) > 0).map(p => p.name), { title: 'Quay thử (không trừ quà)' }); S.data.prizes = keep; };
  $('#pzOk', m.el).onclick = () => { sync(); saveData('prizes', P.filter(p => p.name)); m.close(); toast('Đã lưu quà.'); };
}

/* ---------- AI ---------- */
function openAI() {
  const m = modal({ title: '🤖 Key AI Gemini', body: `<p class="sub">Dùng để AI đọc file / soạn câu hỏi. Key <b>dùng chung với web Dựng video</b> (đã dán bên đó thì không cần dán lại) và chỉ lưu trên máy này.</p>
    <p class="sub">Lấy key miễn phí: vào <a href="https://aistudio.google.com/app/apikey" target="_blank">aistudio.google.com/app/apikey</a> → Create API key → copy rồi dán vào đây. <b>Không gửi key qua tin nhắn cho ai.</b></p>
    <input class="inp" id="aiK" type="password" value="${esc(S.gemKey)}" placeholder="Dán API key…"><p class="sub" style="margin-top:10px">⚠️ Bản miễn phí, Google có thể dùng dữ liệu gửi lên – không gửi tài liệu sản phẩm chưa ra mắt.</p>`, foot: '<button class="btn" id="aiDel">Xoá key</button><span class="grow"></span><button class="btn pri" id="aiOk">Lưu</button>' });
  $('#aiOk', m.el).onclick = () => { S.gemKey = $('#aiK', m.el).value.trim(); store('vs_gem', S.gemKey || null); store('gm_gem_model', null); m.close(); toast(S.gemKey ? 'Đã lưu key trên máy này.' : 'Chưa có key.'); };
  $('#aiDel', m.el).onclick = () => { S.gemKey = ''; store('vs_gem', null); m.close(); toast('Đã xoá key.'); };
}
async function openLetters() {
  const m = modal({ title: '💌 Thư gửi mình 30 ngày sau', body: '<p class="sub">Đang tải…</p>' });
  try {
    const L = await call('gameLetters');
    m.body.innerHTML = L.length ? `<table class="t"><thead><tr><th>Ngày viết</th><th>Lớp</th><th>Người viết</th><th>Nội dung</th><th>Ngày nhắc</th><th></th></tr></thead><tbody>${L.slice().reverse().map(l => `<tr><td>${esc(l.at)}</td><td>${esc(l.cls)}</td><td>${esc(l.who)}</td><td>${esc(l.text)}</td><td>${esc(l.due)}</td><td class="sub">${esc(l.done)}</td></tr>`).join('')}</tbody></table>` : '<p class="sub">Chưa có thư nào – chơi game 50 “Thư gửi mình 30 ngày sau” để cất thư.</p>';
    m.body.insertAdjacentHTML('beforeend', '<p class="sub" style="margin-top:10px">Đến ngày nhắc, bot DingTalk (cùng lúc gửi tin tiến độ 8h sáng) nhắn bạn danh sách thư để gửi lại cho từng bạn.</p>');
  } catch (e) { m.body.innerHTML = `<p class="pill r">${esc(e.message)}</p>`; }
}
boot();
